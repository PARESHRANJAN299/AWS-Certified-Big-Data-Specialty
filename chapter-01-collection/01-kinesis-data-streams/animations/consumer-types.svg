l="#e3b341"/><animateMotion dur="8.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.2500;0.3625;1" path="M222,178 C262,178 270,262 322,262"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7000;0.7037;0.8125;0.8163;1.0000" dur="8.0s" repeatCount="indefinite"/><circle r="5" fill="#e3b341"/><animateMotion dur="8.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.7000;0.8125;1" path="M222,178 C262,178 270,262 322,262"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0625;0.0663;0.1750;0.1787;1.0000" dur="8.0s" repeatCount="indefinite"/><circle r="5" fill="#3fb950"/><animateMotion dur="8.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0625;0.1750;1" path="M610,182 C700,182 720,262 790,262"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2125;0.2162;0.3250;0.3287;1.0000" dur="8.0s" repeatCount="indefinite"/><circle r="5" fill="#3fb950"/><animateMotion dur="8.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.2125;0.3250;1" path="M610,182 C700,182 720,262 790,262"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3625;0.3662;0.4750;0.4787;1.0000" dur="8.0s" repeatCount="indefinite"/><circle r="5" fill="#3fb950"/><animateMotion dur="8.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.3625;0.4750;1" path="M610,182 C700,182 720,262 790,262"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5125;0.5162;0.6250;0.6288;1.0000" dur="8.0s" repeatCount="indefinite"/><circle r="5" fill="#3fb950"/><animateMotion dur="8.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.5125;0.6250;1" path="M610,182 C700,182 720,262 790,262"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6625;0.6663;0.7750;0.7788;1.0000" dur="8.0s" repeatCount="indefinite"/><circle r="5" fill="#3fb950"/><animateMotion dur="8.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.6625;0.7750;1" path="M610,182 C700,182 720,262 790,262"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.8125;0.8163;0.9250;0.9288;1.0000" dur="8.0s" repeatCount="indefinite"/><circle r="5" fill="#3fb950"/><animateMotion dur="8.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.8125;0.9250;1" path="M610,182 C700,182 720,262 790,262"/></g></g><text class="mid" x="40" y="290">More consumers means a smaller slice for each one.</text><text class="mid" x="510" y="290">More consumers do not slow each other down.</text><text class="cap" x="30" y="346" opacity=".35"><animate attributeName="opacity" values="0.35;0.35;1;1;0.35;0.35" keyTimes="0.0000;0.0250;0.0563;0.9750;1.0000;1.0000" dur="8.0s" repeatCount="indefinite"/>1  Standard: all consumers of a shard share its read capacity (around 2 MB/s)</text><text class="cap" x="30" y="370" opacity=".35"><animate attributeName="opacity" values="0.35;0.35;1;1;0.35;0.35" keyTimes="0.0000;0.0250;0.0563;0.9750;1.0000;1.0000" dur="8.0s" repeatCount="indefinite"/>2  Enhanced fan-out: each registered consumer gets its own dedicated read capacity</text><text class="cap" x="30" y="394" opacity=".35"><animate attributeName="opacity" values="0.35;0.35;1;1;0.35;0.35" keyTimes="0.0000;0.0250;0.0563;0.9750;1.0000;1.0000" dur="8.0s" repeatCount="indefinite"/>3  With enhanced fan-out Kinesis pushes the records to the consumer. With standard consumers, the consumer asks.</text></svg>
