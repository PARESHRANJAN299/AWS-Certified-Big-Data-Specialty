<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 592" width="960" height="592" role="img" aria-labelledby="t d"><title id="t">The full Kinesis picture so far</title><desc id="d">A user action reaches an application, which sends records into a stream. The partition key routes each record to a shard, and consumers read from the shards.</desc><defs><style>
 .bg{fill:#0d1117} .node{fill:#161b22;stroke:#30363d;stroke-width:1.5} .big{fill:#161b22;stroke:#e9a23b;stroke-width:2} .panel{fill:#11161d;stroke:#30363d;stroke-width:1.5}
 .t{font:700 18px "Segoe UI",Helvetica,Arial,sans-serif;fill:#e6edf3} .s{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#8b949e} .h{font:700 15px "Segoe UI",Helvetica,Arial,sans-serif;fill:#e6edf3}
 .put{font:700 15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#58a6ff} .get{font:700 15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#e3b341} .ok{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#3fb950} .bad{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#f85149} .amb{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#e3b341}
 .pk{font:700 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace} .cap{font:13px "Segoe UI",Helvetica,Arial,sans-serif;fill:#e6edf3} .tiny{font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#7d8590} .mid{font:12px "Segoe UI",Helvetica,Arial,sans-serif;fill:#aab4c0}
 .slot{fill:#0d1117;stroke:#30363d;stroke-width:1.5;stroke-dasharray:3 3} .lane{fill:none;stroke-width:2.5}
 .gone{fill:#0d1117;stroke:#4b4f55;stroke-width:1.5;stroke-dasharray:4 4}
</style><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#58a6ff"/></marker><marker id="ay" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e3b341"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3fb950"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f85149"/></marker><marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b949e"/></marker><filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect class="bg" width="960" height="592" rx="16"/><rect class="node" x="20" y="196" width="110" height="64" rx="14"/><text class="h" x="75.0" y="234.0" text-anchor="middle">User action</text><rect class="node" x="170" y="186" width="150" height="84" rx="14"/><text class="t" x="245.0" y="226.0" text-anchor="middle">Application</text><text class="s" x="245.0" y="248.0" text-anchor="middle">the Producer</text><path class="lane" stroke="#8b949e" d="M130,228 H168" marker-end="url(#aw)"/><path class="lane" stroke="#58a6ff" d="M320,228 H418" marker-end="url(#ab)"/><text class="put" x="369" y="212" text-anchor="middle" style="font-size:12px">PutRecord</text><text class="put" x="369" y="250" text-anchor="middle" style="font-size:12px">PutRecords</text><rect class="big" x="420" y="60" width="290" height="380" rx="14"/><text class="t" x="565" y="90" text-anchor="middle">Kinesis stream</text><text class="tiny" x="345" y="285" text-anchor="middle">the partition key</text><text class="tiny" x="345" y="299" text-anchor="middle">decides the route</text><rect class="panel" x="434" y="110" width="262" height="70" rx="10"/><text class="s" x="446" y="130">Shard 1</text><rect class="slot" x="446" y="140" width="70" height="30" rx="6"/><rect class="slot" x="526" y="140" width="70" height="30" rx="6"/><rect class="slot" x="606" y="140" width="70" height="30" rx="6"/><rect class="panel" x="434" y="210" width="262" height="70" rx="10"/><text class="s" x="446" y="230">Shard 2</text><rect class="slot" x="446" y="240" width="70" height="30" rx="6"/><rect class="slot" x="526" y="240" width="70" height="30" rx="6"/><rect class="slot" x="606" y="240" width="70" height="30" rx="6"/><rect class="panel" x="434" y="310" width="262" height="70" rx="10"/><text class="s" x="446" y="330">Shard 3</text><rect class="slot" x="446" y="340" width="70" height="30" rx="6"/><rect class="slot" x="526" y="340" width="70" height="30" rx="6"/><rect class="slot" x="606" y="340" width="70" height="30" rx="6"/><g filter="url(#glow)"><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0400;0.0430;0.1300;0.1330;1.0000" dur="10.0s" repeatCount="indefinite"/><circle r="6" fill="#58a6ff"/><animateMotion dur="10.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0400;0.1300;1" path="M320,228 C380,228 400,155 444,155"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1100;0.1130;0.2000;0.2030;1.0000" dur="10.0s" repeatCount="indefinite"/><circle r="6" fill="#e9a23b"/><animateMotion dur="10.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1100;0.2000;1" path="M320,228 C380,228 400,255 444,255"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1800;0.1830;0.2700;0.2730;1.0000" dur="10.0s" repeatCount="indefinite"/><circle r="6" fill="#3fb950"/><animateMotion dur="10.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1800;0.2700;1" path="M320,228 C380,228 400,355 444,355"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2500;0.2530;0.3400;0.3430;1.0000" dur="10.0s" repeatCount="indefinite"/><circle r="6" fill="#58a6ff"/><animateMotion dur="10.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.2500;0.3400;1" path="M320,228 C380,228 400,155 444,155"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4700;0.4730;0.5600;0.5630;1.0000" dur="10.0s" repeatCount="indefinite"/><circle r="6" fill="#e3b341"/><animateMotion dur="10.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.4700;0.5600;1" path="M698,172 H790"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6700;0.6730;0.7600;0.7630;1.0000" dur="10.0s" repeatCount="indefinite"/><circle r="6" fill="#e3b341"/><animateMotion dur="10.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.6700;0.7600;1" path="M698,172 H790"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4700;0.4730;0.5600;0.5630;1.0000" dur="10.0s" repeatCount="indefinite"/><circle r="6" fill="#3fb950"/><animateMotion dur="10.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.4700;0.5600;1" path="M698,352 H790"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6700;0.6730;0.7600;0.7630;1.0000" dur="10.0s" repeatCount="indefinite"/><circle r="6" fill="#3fb950"/><animateMotion dur="10.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.6700;0.7600;1" path="M698,352 H790"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1300;0.1450;0.9500;0.9650;1.0000" dur="10.0s" repeatCount="indefinite"/><rect x="446" y="140" width="70" height="30" rx="6" fill="#58a6ff"/><text x="481.0" y="159.0" text-anchor="middle" style="font:700 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#0d1117">seq #1</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2000;0.2150;0.9500;0.9650;1.0000" dur="10.0s" repeatCount="indefinite"/><rect x="446" y="240" width="70" height="30" rx="6" fill="#e9a23b"/><text x="481.0" y="259.0" text-anchor="middle" style="font:700 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#0d1117">seq #1</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2700;0.2850;0.9500;0.9650;1.0000" dur="10.0s" repeatCount="indefinite"/><rect x="446" y="340" width="70" height="30" rx="6" fill="#3fb950"/><text x="481.0" y="359.0" text-anchor="middle" style="font:700 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#0d1117">seq #1</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3400;0.3550;0.9500;0.9650;1.0000" dur="10.0s" repeatCount="indefinite"/><rect x="526" y="140" width="70" height="30" rx="6" fill="#58a6ff"/><text x="561.0" y="159.0" text-anchor="middle" style="font:700 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#0d1117">seq #2</text></g><rect class="node" x="792" y="130" width="150" height="84" rx="14"/><text class="t" x="867.0" y="170.0" text-anchor="middle">Standard</text><text class="s" x="867.0" y="192.0" text-anchor="middle">consumer</text><rect class="node" x="792" y="310" width="150" height="84" rx="14"/><text class="h" x="867.0" y="350.0" text-anchor="middle">Enhanced fan-out</text><text class="s" x="867.0" y="372.0" text-anchor="middle">consumer</text><path class="lane" stroke="#e3b341" d="M790,172 H700" marker-end="url(#ay)"/><text class="get" x="745" y="158" text-anchor="middle" style="font-size:12px">GET</text><text class="tiny" x="745" y="196" text-anchor="middle">consumer asks</text><path class="lane" stroke="#3fb950" d="M700,352 H790" marker-end="url(#ag)"/><text class="ok" x="745" y="338" text-anchor="middle">pushed</text><text class="tiny" x="745" y="376" text-anchor="middle">dedicated</text><text class="mid" x="565" y="462" text-anchor="middle">Inside each shard: Record, then Sequence Number, then Ordering</text><text class="cap" x="30" y="498" opacity=".35"><animate attributeName="opacity" values="0.35;0.35;1;1;0.35;0.35" keyTimes="0.0000;0.0200;0.0450;0.3000;0.3250;1.0000" dur="10.0s" repeatCount="indefinite"/>1  A user action reaches the application, which is the Producer</text><text class="cap" x="30" y="522" opacity=".35"><animate attributeName="opacity" values="0.35;0.35;1;1;0.35;0.35" keyTimes="0.0000;0.0200;0.0450;0.3500;0.3750;1.0000" dur="10.0s" repeatCount="indefinite"/>2  The Producer sends records with PutRecord or PutRecords, each with a partition key</text><text class="cap" x="30" y="546" opacity=".35"><animate attributeName="opacity" values="0.35;0.35;1;1;0.35;0.35" keyTimes="0.0000;0.1000;0.1250;0.4000;0.4250;1.0000" dur="10.0s" repeatCount="indefinite"/>3  The partition key routes each record to a shard, and the shard gives it a sequence number</text><text class="cap" x="30" y="570" opacity=".35"><animate attributeName="opacity" values="0.35;0.35;1;1;0.35;0.35" keyTimes="0.0000;0.4000;0.4250;0.9500;0.9750;1.0000" dur="10.0s" repeatCount="indefinite"/>4  Consumers read the records: standard consumers share read capacity, enhanced fan-out gets its own</text></svg>
