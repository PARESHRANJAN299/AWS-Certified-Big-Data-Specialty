<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img" aria-labelledby="t d"><title id="t">Independent readers and consumer lag</title><desc id="d">Three readers read the same stream at different speeds. The distance between a reader and the newest event is its lag.</desc><defs><style>
 .bg{fill:#0d1117} .node{fill:#161b22;stroke:#30363d;stroke-width:1.5} .big{fill:#161b22;stroke:#e9a23b;stroke-width:2} .panel{fill:#11161d;stroke:#30363d;stroke-width:1.5}
 .t{font:700 18px "Segoe UI",Helvetica,Arial,sans-serif;fill:#e6edf3} .s{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#8b949e} .h{font:700 15px "Segoe UI",Helvetica,Arial,sans-serif;fill:#e6edf3}
 .put{font:700 15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#58a6ff} .get{font:700 15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#e3b341} .ok{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#3fb950} .bad{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#f85149} .amb{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#e3b341}
 .pk{font:700 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace} .cap{font:13px "Segoe UI",Helvetica,Arial,sans-serif;fill:#e6edf3} .tiny{font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#7d8590} .mid{font:12px "Segoe UI",Helvetica,Arial,sans-serif;fill:#aab4c0}
 .slot{fill:#0d1117;stroke:#30363d;stroke-width:1.5;stroke-dasharray:3 3} .lane{fill:none;stroke-width:2.5}
 .gone{fill:#0d1117;stroke:#4b4f55;stroke-width:1.5;stroke-dasharray:4 4}
</style><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#58a6ff"/></marker><marker id="ay" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e3b341"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3fb950"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f85149"/></marker><marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b949e"/></marker><filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect class="bg" width="960" height="460" rx="16"/><text class="h" x="40" y="44">One stream, three readers</text><rect x="170" y="70" width="50" height="40" rx="8" fill="#12304f" stroke="#2f81d8" stroke-width="1.5"/><text x="195.0" y="95" text-anchor="middle" style="font:700 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#c9d1d9">1</text><rect x="226" y="70" width="50" height="40" rx="8" fill="#12304f" stroke="#2f81d8" stroke-width="1.5"/><text x="251.0" y="95" text-anchor="middle" style="font:700 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#c9d1d9">2</text><rect x="282" y="70" width="50" height="40" rx="8" fill="#12304f" stroke="#2f81d8" stroke-width="1.5"/><text x="307.0" y="95" text-anchor="middle" style="font:700 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#c9d1d9">3</text><rect x="338" y="70" width="50" height="40" rx="8" fill="#12304f" stroke="#2f81d8" stroke-width="1.5"/><text x="363.0" y="95" text-anchor="middle" style="font:700 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#c9d1d9">4</text><rect x="394" y="70" width="50" height="40" rx="8" fill="#12304f" stroke="#2f81d8" stroke-width="1.5"/><text x="419.0" y="95" text-anchor="middle" style="font:700 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#c9d1d9">5</text><rect x="450" y="70" width="50" height="40" rx="8" fill="#12304f" stroke="#2f81d8" stroke-width="1.5"/><text x="475.0" y="95" text-anchor="middle" style="font:700 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#c9d1d9">6</text><rect x="506" y="70" width="50" height="40" rx="8" fill="#12304f" stroke="#2f81d8" stroke-width="1.5"/><text x="531.0" y="95" text-anchor="middle" style="font:700 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#c9d1d9">7</text><rect x="562" y="70" width="50" height="40" rx="8" fill="#12304f" stroke="#2f81d8" stroke-width="1.5"/><text x="587.0" y="95" text-anchor="middle" style="font:700 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#c9d1d9">8</text><rect x="618" y="70" width="50" height="40" rx="8" fill="#12304f" stroke="#2f81d8" stroke-width="1.5"/><text x="643.0" y="95" text-anchor="middle" style="font:700 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#c9d1d9">9</text><rect x="674" y="70" width="50" height="40" rx="8" fill="#12304f" stroke="#2f81d8" stroke-width="1.5"/><text x="699.0" y="95" text-anchor="middle" style="font:700 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#c9d1d9">10</text><rect x="730" y="70" width="50" height="40" rx="8" fill="#12304f" stroke="#2f81d8" stroke-width="1.5"/><text x="755.0" y="95" text-anchor="middle" style="font:700 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#c9d1d9">11</text><rect x="786" y="70" width="50" height="40" rx="8" fill="#12304f" stroke="#e3b341" stroke-width="2.5"/><text x="811.0" y="95" text-anchor="middle" style="font:700 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#c9d1d9">12</text><text class="amb" x="811.0" y="62" text-anchor="middle">newest</text><text class="h" x="40" y="179">Reader A</text><text class="tiny" x="40" y="197">small lag</text><rect x="170" y="183" width="666" height="2" fill="#21262d"/><rect y="179" height="8" rx="4" fill="#f85149" opacity=".55" x="654.2" width="156.8"><animate attributeName="x" values="654.2;777.4" dur="10.0s" repeatCount="indefinite"/><animate attributeName="width" values="156.8;33.6" dur="10.0s" repeatCount="indefinite"/></rect><g><path d="M0,0 L-9,-16 L9,-16 z" fill="#3fb950" transform="translate(0,185)"/><animateTransform attributeName="transform" type="translate" values="654.2,0;777.4,0" dur="10.0s" repeatCount="indefinite"/></g><text class="h" x="40" y="249">Reader B</text><text class="tiny" x="40" y="267">medium lag</text><rect x="170" y="253" width="666" height="2" fill="#21262d"/><rect y="249" height="8" rx="4" fill="#f85149" opacity=".55" x="475.0" width="336.0"><animate attributeName="x" values="475.0;553.4" dur="10.0s" repeatCount="indefinite"/><animate attributeName="width" values="336.0;257.6" dur="10.0s" repeatCount="indefinite"/></rect><g><path d="M0,0 L-9,-16 L9,-16 z" fill="#3fb950" transform="translate(0,255)"/><animateTransform attributeName="transform" type="translate" values="475.0,0;553.4,0" dur="10.0s" repeatCount="indefinite"/></g><text class="h" x="40" y="319">Reader C</text><text class="tiny" x="40" y="337">large lag</text><rect x="170" y="323" width="666" height="2" fill="#21262d"/><rect y="319" height="8" rx="4" fill="#f85149" opacity=".55" x="307.0" width="504.0"><animate attributeName="x" values="307.0;351.8" dur="10.0s" repeatCount="indefinite"/><animate attributeName="width" values="504.0;459.2" dur="10.0s" repeatCount="indefinite"/></rect><g><path d="M0,0 L-9,-16 L9,-16 z" fill="#3fb950" transform="translate(0,325)"/><animateTransform attributeName="transform" type="translate" values="307.0,0;351.8,0" dur="10.0s" repeatCount="indefinite"/></g><text class="cap" x="40" y="392" opacity=".35"><animate attributeName="opacity" values="0.35;0.35;1;1;0.35;0.35" keyTimes="0.0000;0.0200;0.0450;0.9800;1.0000;1.0000" dur="10.0s" repeatCount="indefinite"/>1  All three readers read the same stream. Reading does not remove any event.</text><text class="cap" x="40" y="416" opacity=".35"><animate attributeName="opacity" values="0.35;0.35;1;1;0.35;0.35" keyTimes="0.0000;0.0200;0.0450;0.9800;1.0000;1.0000" dur="10.0s" repeatCount="indefinite"/>2  Each reader keeps its own position and moves at its own speed.</text><text class="cap" x="40" y="440" opacity=".35"><animate attributeName="opacity" values="0.35;0.35;1;1;0.35;0.35" keyTimes="0.0000;0.0200;0.0450;0.9800;1.0000;1.0000" dur="10.0s" repeatCount="indefinite"/>3  Consumer lag is how far a reader is behind the newest event: the red bar.</text></svg>
