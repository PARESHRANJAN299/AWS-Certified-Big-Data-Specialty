#58a6ff">key A</text><rect x="715" y="62" width="90" height="38" rx="8" fill="none" stroke="#58a6ff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5800;0.5900;0.6600;0.6700;1.0000" dur="10.0s" repeatCount="indefinite"/></rect><rect class="panel" x="30" y="200" width="620" height="48" rx="10"/><text class="s" x="44" y="229">Shard 1</text><rect class="slot" x="150" y="207" width="120" height="34" rx="6"/><rect class="slot" x="290" y="207" width="120" height="34" rx="6"/><rect class="slot" x="430" y="207" width="120" height="34" rx="6"/><text class="ok" x="640" y="229" text-anchor="end">order kept</text><rect class="panel" x="30" y="262" width="620" height="48" rx="10"/><text class="s" x="44" y="291">Shard 2</text><rect class="slot" x="150" y="269" width="120" height="34" rx="6"/><rect class="slot" x="290" y="269" width="120" height="34" rx="6"/><rect class="slot" x="430" y="269" width="120" height="34" rx="6"/><text class="ok" x="640" y="291" text-anchor="end">order kept</text><rect class="panel" x="30" y="324" width="620" height="48" rx="10"/><text class="s" x="44" y="353">Shard 3</text><rect class="slot" x="150" y="331" width="120" height="34" rx="6"/><rect class="slot" x="290" y="331" width="120" height="34" rx="6"/><rect class="slot" x="430" y="331" width="120" height="34" rx="6"/><text class="ok" x="640" y="353" text-anchor="end">order kept</text><g filter="url(#glow)"><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1000;0.1030;0.1900;0.1930;1.0000" dur="10.0s" repeatCount="indefinite"/><circle r="6" fill="#58a6ff"/><animateMotion dur="10.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1000;0.1900;1" path="M110,102 C110,150 210,150 210,206"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2000;0.2030;0.2900;0.2930;1.0000" dur="10.0s" repeatCount="indefinite"/><circle r="6" fill="#e9a23b"/><animateMotion dur="10.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.2000;0.2900;1" path="M240,102 C240,150 210,150 210,268"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3000;0.3030;0.3900;0.3930;1.0000" dur="10.0s" repeatCount="indefinite"/><circle r="6" fill="#58a6ff"/><animateMotion dur="10.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.3000;0.3900;1" path="M370,102 C370,150 350,150 350,206"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4000;0.4030;0.4900;0.4930;1.0000" dur="10.0s" repeatCount="indefinite"/><circle r="6" fill="#3fb950"/><animateMotion dur="10.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.4000;0.4900;1" path="M500,102 C500,150 210,150 210,330"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5000;0.5030;0.5900;0.5930;1.0000" dur="10.0s" repeatCount="indefinite"/><circle r="6" fill="#e9a23b"/><animateMotion dur="10.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.5000;0.5900;1" path="M630,102 C630,150 350,150 350,268"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6000;0.6030;0.6900;0.6930;1.0000" dur="10.0s" repeatCount="indefinite"/><circle r="6" fill="#58a6ff"/><animateMotion dur="10.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.6000;0.6900;1" path="M760,102 C760,150 490,150 490,206"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1900;0.2050;0.9500;0.9650;1.0000" dur="10.0s" repeatCount="indefinite"/><rect x="150" y="207" width="120" height="34" rx="6" fill="#58a6ff"/><text x="210.0" y="228.0" text-anchor="middle" style="font:700 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#0d1117">key A  #1</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2900;0.3050;0.9500;0.9650;1.0000" dur="10.0s" repeatCount="indefinite"/><rect x="150" y="269" width="120" height="34" rx="6" fill="#e9a23b"/><text x="210.0" y="290.0" text-anchor="middle" style="font:700 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#0d1117">key B  #1</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3900;0.4050;0.9500;0.9650;1.0000" dur="10.0s" repeatCount="indefinite"/><rect x="290" y="207" width="120" height="34" rx="6" fill="#58a6ff"/><text x="350.0" y="228.0" text-anchor="middle" style="font:700 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#0d1117">key A  #2</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4900;0.5050;0.9500;0.9650;1.0000" dur="10.0s" repeatCount="indefinite"/><rect x="150" y="331" width="120" height="34" rx="6" fill="#3fb950"/><text x="210.0" y="352.0" text-anchor="middle" style="font:700 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#0d1117">key C  #1</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5900;0.6050;0.9500;0.9650;1.0000" dur="10.0s" repeatCount="indefinite"/><rect x="290" y="269" width="120" height="34" rx="6" fill="#e9a23b"/><text x="350.0" y="290.0" text-anchor="middle" style="font:700 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#0d1117">key B  #2</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6900;0.7050;0.9500;0.9650;1.0000" dur="10.0s" repeatCount="indefinite"/><rect x="430" y="207" width="120" height="34" rx="6" fill="#58a6ff"/><text x="490.0" y="228.0" text-anchor="middle" style="font:700 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#0d1117">key A  #3</text></g><path d="M770,205 V366" stroke="#e3b341" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#ay)" marker-start="url(#ay)" fill="none"/><text class="amb" x="790" y="270">no order</text><text class="amb" x="790" y="288">guarantee</text><text class="amb" x="790" y="306">between</text><text class="amb" x="790" y="324">shards</text><text class="cap" x="40" y="400" opacity=".35"><animate attributeName="opacity" values="0.35;0.35;1;1;0.35;0.35" keyTimes="0.0000;0.0500;0.0750;0.7000;0.7250;1.0000" dur="10.0s" repeatCount="indefinite"/>1  Records arrive in real time: A, B, A, C, B, A</text><text class="cap" x="40" y="424" opacity=".35"><animate attributeName="opacity" values="0.35;0.35;1;1;0.35;0.35" keyTimes="0.0000;0.1500;0.1750;0.9000;0.9250;1.0000" dur="10.0s" repeatCount="indefinite"/>2  Each shard keeps its own records in the order they arrived</text><text class="cap" x="40" y="448" opacity=".35"><animate attributeName="opacity" values="0.35;0.35;1;1;0.35;0.35" keyTimes="0.0000;0.6800;0.7050;0.9900;1.0000;1.0000" dur="10.0s" repeatCount="indefinite"/>3  Kinesis does not order records across shards (there is no global order)</text><text class="cap" x="40" y="472" opacity=".35"><animate attributeName="opacity" values="0.35;0.35;1;1;0.35;0.35" keyTimes="0.0000;0.6800;0.7050;0.9900;1.0000;1.0000" dur="10.0s" repeatCount="indefinite"/>4  Same partition key, same shard: the records for one key stay in order</text></svg>
