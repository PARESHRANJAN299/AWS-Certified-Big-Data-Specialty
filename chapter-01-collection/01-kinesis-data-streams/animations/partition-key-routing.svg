.0" text-anchor="middle" style="font:700 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#0d1117">#3</text></g><text class="cap" x="40" y="356" opacity=".35"><animate attributeName="opacity" values="0.35;0.35;1;1;0.35;0.35" keyTimes="0.0000;0.0200;0.0450;0.9000;0.9250;1.0000" dur="10.0s" repeatCount="indefinite"/>1  The Producer sends records, each with a partition key (user-A, user-B, user-C)</text><text class="cap" x="40" y="380" opacity=".35"><animate attributeName="opacity" values="0.35;0.35;1;1;0.35;0.35" keyTimes="0.0000;0.1000;0.1250;0.9000;0.9250;1.0000" dur="10.0s" repeatCount="indefinite"/>2  The same key always goes to the same shard: user-A always lands in Shard 1</text><text class="cap" x="40" y="404" opacity=".35"><animate attributeName="opacity" values="0.35;0.35;1;1;0.35;0.35" keyTimes="0.0000;0.3000;0.3250;0.9600;0.9850;1.0000" dur="10.0s" repeatCount="indefinite"/>3  Inside a shard, Kinesis numbers the records in the order they arrive (#1, #2, #3)</text></svg>
