 .put{font:700 15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#58a6ff} .get{font:700 15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#e3b341} .ok{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#3fb950} .bad{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#f85149} .amb{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#e3b341}
 .pk{font:700 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace} .cap{font:13px "Segoe UI",Helvetica,Arial,sans-serif;fill:#e6edf3} .tiny{font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#7d8590} .mid{font:12px "Segoe UI",Helvetica,Arial,sans-serif;fill:#aab4c0}
 .slot{fill:#0d1117;stroke:#30363d;stroke-width:1.5;stroke-dasharray:3 3} .lane{fill:none;stroke-width:2.5}
 .gone{fill:#0d1117;stroke:#4b4f55;stroke-width:1.5;stroke-dasharray:4 4}
</style><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#58a6ff"/></marker><marker id="ay" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e3b341"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3fb950"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f85149"/></marker><marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b949e"/></marker><filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect class="bg" width="960" height="430" rx="16"/><rect class="node" x="30" y="130" width="130" height="100" rx="14"/><text class="t" x="95.0" y="178.0" text-anchor="middle">Producer</text><text class="s" x="95.0" y="200.0" text-anchor="middle">sends records</text><rect class="node" x="230" y="150" width="130" height="60" rx="14"/><text class="h" x="295.0" y="178.0" text-anchor="middle">partition key</text><text class="s" x="295.0" y="200.0" text-anchor="middle">picks the shard</text><text class="tiny" x="295" y="140" text-anchor="middle">you choose the key</text><text class="tiny" x="295" y="228" text-anchor="middle">Kinesis chooses the shard</text><rect class="big" x="470" y="50" width="460" height="270" rx="14"/><text class="h" x="490" y="76">Stream</text><rect class="panel" x="486" y="95" width="428" height="54" rx="10"/><text class="s" x="498" y="127">Shard 1</text><rect class="slot" x="590" y="105" width="68" height="34" rx="6"/><rect class="slot" x="670" y="105" width="68" height="34" rx="6"/><rect class="slot" x="750" y="105" width="68" height="34" rx="6"/><rect class="slot" x="830" y="105" width="68" height="34" rx="6"/><rect class="panel" x="486" y="175" width="428" height="54" rx="10"/><text class="s" x="498" y="207">Shard 2</text><rect class="slot" x="590" y="185" width="68" height="34" rx="6"/><rect class="slot" x="670" y="185" width="68" height="34" rx="6"/><rect class="slot" x="750" y="185" width="68" height="34" rx="6"/><rect class="slot" x="830" y="185" width="68" height="34" rx="6"/><rect class="panel" x="486" y="255" width="428" height="54" rx="10"/><text class="s" x="498" y="287">Shard 3</text><rect class="slot" x="590" y="265" width="68" height="34" rx="6"/><rect class="slot" x="670" y="265" width="68" height="34" rx="6"/><rect class="slot" x="750" y="265" width="68" height="34" rx="6"/><rect class="slot" x="830" y="265" width="68" height="34" rx="6"/><path class="lane" stroke="#8b949e" d="M160,180 H228" marker-end="url(#aw)"/><path d="M360,180 C420,180 430,122 484,122" fill="none" stroke="#30363d" stroke-width="2"/><path d="M360,180 C420,180 430,202 484,202" fill="none" stroke="#30363d" stroke-width="2"/><path d="M360,180 C420,180 430,282 484,282" fill="none" stroke="#30363d" stroke-width="2"/><g filter="url(#glow)"><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0300;0.0330;0.0750;0.0780;1.0000" dur="10.0s" repeatCount="indefinite"/><circle r="6" fill="#58a6ff"/><text y="-12" text-anchor="middle" class="pk" style="fill:#58a6ff">user-A</text><animateMotion dur="10.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0300;0.0750;1" path="M160,180 H228"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0750;0.0780;0.1300;0.1330;1.0000" dur="10.0s" repeatCount="indefinite"/><circle r="6" fill="#58a6ff"/><animateMotion dur="10.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0750;0.1300;1" path="M360,180 C420,180 430,12