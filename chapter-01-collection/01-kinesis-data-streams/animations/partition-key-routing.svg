<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-labelledby="t d"><title id="t">Partition key routing</title><desc id="d">Records with the same partition key always go to the same shard, and each shard numbers its records in arrival order.</desc><defs><style>
 .bg{fill:#0d1117} .node{fill:#161b22;stroke:#30363d;stroke-width:1.5} .big{fill:#161b22;stroke:#e9a23b;stroke-width:2} .panel{fill:#11161d;stroke:#30363d;stroke-width:1.5}
