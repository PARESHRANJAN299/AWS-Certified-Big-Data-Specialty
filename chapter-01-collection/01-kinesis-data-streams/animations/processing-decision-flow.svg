<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" width="960" height="530" role="img" aria-labelledby="t d"><title id="t">Choosing a processing engine</title><desc id="d">Four example workloads, each following the decision to one engine: simple event processing to Lambda, continuous real-time calculations to Flink, heavy transformation to EMR or Spark, custom logic to EC2 or ECS.</desc><defs><style>
 .bg{fill:#0d1117} .node{fill:#161b22;stroke:#30363d;stroke-width:1.5} .big{fill:#161b22;stroke:#e9a23b;stroke-width:2} .panel{fill:#11161d;stroke:#30363d;stroke-width:1.5}
 .t{font:700 18px "Segoe UI",Helvetica,Arial,sans-serif;fill:#e6edf3} .s{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#8b949e} .h{font:700 15px "Segoe UI",Helvetica,Arial,sans-serif;fill:#e6edf3}
 .put{font:700 15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#58a6ff} .get{font:700 15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#e3b341} .ok{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#3fb950} .bad{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#f85149} .amb{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#e3b341}
 .pk{font:700 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace} .cap{font:13px "Segoe UI",Helvetica,Arial,sans-serif;fill:#e6edf3} .tiny{font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#7d8590} .mid{font:12px "Segoe UI",Helvetica,Arial,sans-serif;fill:#aab4c0}
 .slot{fill:#0d1117;stroke:#30363d;stroke-width:1.5;stroke-dasharray:3 3} .lane{fill:none;stroke-width:2.5}
 .gone{fill:#0d1117;stroke:#4b4f55;stroke-width:1.5;stroke-dasharray:4 4}
</style><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#58a6ff"/></marker><marker id="ay" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e3b341"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3fb950"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f85149"/></marker><marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b949e"/></marker><filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect class="bg" width="960" height="530" rx="16"/><text class="h" x="30" y="40" style="font-size:17px">First define the use case, then choose the processing service.</text><rect class="node" x="30" y="200" width="140" height="76" rx="14"/><text class="h" x="100.0" y="236.0" text-anchor="middle">Event stream</text><text class="s" x="100.0" y="258.0" text-anchor="middle">the workload</text><path d="M170,238 H210" stroke="#3d444d" stroke-width="2" fill="none"/><path d="M210,112 V382" stroke="#3d444d" stroke-width="2" fill="none"/><path d="M210,112 H238" stroke="#3d444d" stroke-width="2" fill="none" marker-end="url(#aw)"/><rect class="node" x="240" y="80" width="330" height="64" rx="12"/><text class="h" x="256" y="109.0">Simple per-event logic</text><text class="s" x="256" y="128.0">a few seconds are fine</text><path d="M570,112 H638" stroke="#3d444d" stroke-width="2" fill="none" marker-end="url(#aw)"/><text class="tiny" x="604" y="104" text-anchor="middle">yes</text><rect class="node" x="640" y="80" width="290" height="64" rx="12"/><text class="h" x="656" y="109.0">AWS Lambda</text><text class="s" x="656" y="128.0">small, fast, event-driven</text><path d="M210,202 H238" stroke="#3d444d" stroke-width="2" fill="none" marker-end="url(#aw)"/><rect class="node" x="240" y="170" width="330" height="64" rx="12"/><text class="h" x="256" y="199.0">Continuous, stateful, low latency</text><text class="s" x="256" y="218.0">windows, joins, running totals</text><path d="M570,202 H638" stroke="#3d444d" stroke-width="2" fill="none" marker-end="url(#aw)"/><text class="tiny" x="604" y="194" text-anchor="middle">yes</text><rect class="node" x="640" y="170" width="290" height="64" rx="12"/><text class="h" x="656" y="199.0">Managed Apache Flink</text><text class="s" x="656" y="218.0">stateful real-time analytics</text><path d="M210,292 H238" stroke="#3d444d" stroke-width="2" fill="none" marker-end="url(#aw)"/><rect class="node" x="240" y="260" width="330" height="64" rx="12"/><text class="h" x="256" y="289.0">Heavy transformation, huge data</text><text class="s" x="256" y="308.0">batch jobs, large joins, ETL</text><path d="M570,292 H638" stroke="#3d444d" stroke-width="2" fill="none" marker-end="url(#aw)"/><text class="tiny" x="604" y="284" text-anchor="middle">yes</text><rect class="node" x="640" y="260" width="290" height="64" rx="12"/><text class="h" x="656" y="289.0">EMR / Spark</text><text class="s" x="656" y="308.0">large-scale transformations</text><path d="M210,382 H238" stroke="#3d444d" stroke-width="2" fill="none" marker-end="url(#aw)"/><rect class="node" x="240" y="350" width="330" height="64" rx="12"/><text class="h" x="256" y="379.0">Custom code or full control</text><text class="s" x="256" y="398.0">your own long-running application</text><path d="M570,382 H638" stroke="#3d444d" stroke-width="2" fill="none" marker-end="url(#aw)"/><text class="tiny" x="604" y="374" text-anchor="middle">yes</text><rect class="node" x="640" y="350" width="290" height="64" rx="12"/><text class="h" x="656" y="379.0">EC2 / ECS</text><text class="s" x="656" y="398.0">your own app, full control</text><rect x="240" y="80" width="330" height="64" rx="14" fill="none" stroke="#e3b341" stroke-width="3" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0750;0.0844;0.2313;0.2406;1.0000" dur="16.0s" repeatCount="indefinite"/></rect><rect x="640" y="80" width="290" height="64" rx="14" fill="none" stroke="#3fb950" stroke-width="3" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1250;0.1344;0.2313;0.2406;1.0000" dur="16.0s" repeatCount="indefinite"/></rect><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0094;0.0187;0.2406;0.2500;1.0000" dur="16.0s" repeatCount="indefinite"/><text class="h" x="480" y="470" text-anchor="middle" style="font-size:18px;fill:#e3b341">Simple event transformation  →  Lambda</text></g><rect x="240" y="170" width="330" height="64" rx="14" fill="none" stroke="#e3b341" stroke-width="3" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3250;0.3344;0.4813;0.4906;1.0000" dur="16.0s" repeatCount="indefinite"/></rect><rect x="640" y="170" width="290" height="64" rx="14" fill="none" stroke="#3fb950" stroke-width="3" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3750;0.3844;0.4813;0.4906;1.0000" dur="16.0s" repeatCount="indefinite"/></rect><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2594;0.2688;0.4906;0.5000;1.0000" dur="16.0s" repeatCount="indefinite"/><text class="h" x="480" y="470" text-anchor="middle" style="font-size:18px;fill:#e3b341">Continuous real-time calculations  →  Flink</text></g><rect x="240" y="260" width="330" height="64" rx="14" fill="none" stroke="#e3b341" stroke-width="3" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5750;0.5844;0.7312;0.7406;1.0000" dur="16.0s" repeatCount="indefinite"/></rect><rect x="640" y="260" width="290" height="64" rx="14" fill="none" stroke="#3fb950" stroke-width="3" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6250;0.6344;0.7312;0.7406;1.0000" dur="16.0s" repeatCount="indefinite"/></rect><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5094;0.5188;0.7406;0.7500;1.0000" dur="16.0s" repeatCount="indefinite"/><text class="h" x="480" y="470" text-anchor="middle" style="font-size:18px;fill:#e3b341">Heavy transformation on huge data  →  EMR / Spark</text></g><rect x="240" y="350" width="330" height="64" rx="14" fill="none" stroke="#e3b341" stroke-width="3" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.8250;0.8344;0.9812;0.9906;1.0000" dur="16.0s" repeatCount="indefinite"/></rect><rect x="640" y="350" width="290" height="64" rx="14" fill="none" stroke="#3fb950" stroke-width="3" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.8750;0.8844;0.9812;0.9906;1.0000" dur="16.0s" repeatCount="indefinite"/></rect><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7594;0.7688;0.9906;1.0000;1.0000" dur="16.0s" repeatCount="indefinite"/><text class="h" x="480" y="470" text-anchor="middle" style="font-size:18px;fill:#e3b341">Custom application logic  →  EC2 / ECS</text></g><g filter="url(#glow)"><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0125;0.0144;0.0750;0.0769;1.0000" dur="16.0s" repeatCount="indefinite"/><circle r="6" fill="#58a6ff"/><animateMotion dur="16.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0125;0.0750;1" path="M170,238 H210 V112 H240"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0938;0.0956;0.1313;0.1331;1.0000" dur="16.0s" repeatCount="indefinite"/><circle r="6" fill="#3fb950"/><animateMotion dur="16.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0938;0.1313;1" path="M570,112 H640"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2625;0.2644;0.3250;0.3269;1.0000" dur="16.0s" repeatCount="indefinite"/><circle r="6" fill="#58a6ff"/><animateMotion dur="16.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.2625;0.3250;1" path="M170,238 H210 V202 H240"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3438;0.3456;0.3812;0.3831;1.0000" dur="16.0s" repeatCount="indefinite"/><circle r="6" fill="#3fb950"/><animateMotion dur="16.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.3438;0.3812;1" path="M570,202 H640"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5125;0.5144;0.5750;0.5769;1.0000" dur="16.0s" repeatCount="indefinite"/><circle r="6" fill="#58a6ff"/><animateMotion dur="16.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.5125;0.5750;1" path="M170,238 H210 V292 H240"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5938;0.5956;0.6312;0.6331;1.0000" dur="16.0s" repeatCount="indefinite"/><circle r="6" fill="#3fb950"/><animateMotion dur="16.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.5938;0.6312;1" path="M570,292 H640"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7625;0.7644;0.8250;0.8269;1.0000" dur="16.0s" repeatCount="indefinite"/><circle r="6" fill="#58a6ff"/><animateMotion dur="16.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.7625;0.8250;1" path="M170,238 H210 V382 H240"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.8438;0.8456;0.8812;0.8831;1.0000" dur="16.0s" repeatCount="indefinite"/><circle r="6" fill="#3fb950"/><animateMotion dur="16.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.8438;0.8812;1" path="M570,382 H640"/></g></g><text class="mid" x="480" y="508" text-anchor="middle">Real systems mix several engines. The workload, not the company name, decides.</text></svg>
