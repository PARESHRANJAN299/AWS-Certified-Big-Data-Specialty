/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4208;0.4233;0.5208;0.5233;1.0000" dur="12.0s" repeatCount="indefinite"/><circle r="4" fill="#a371f7"/><animateMotion dur="12.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.4208;0.5208;1" path="M490,282 C490,330 640,330 640,282"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4083;0.4108;0.5083;0.5108;1.0000" dur="12.0s" repeatCount="indefinite"/><circle r="4" fill="#a371f7"/><animateMotion dur="12.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.4083;0.5083;1" path="M640,282 C640,330 340,330 340,282"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4208;0.4233;0.5208;0.5233;1.0000" dur="12.0s" repeatCount="indefinite"/><circle r="4" fill="#a371f7"/><animateMotion dur="12.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.4208;0.5208;1" path="M640,282 C640,330 490,330 490,282"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5833;0.5858;0.6833;0.6858;1.0000" dur="12.0s" repeatCount="indefinite"/><circle r="5" fill="#3fb950"/><animateMotion dur="12.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.5833;0.6833;1" path="M405,245 C465,245 800,200 828,200"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6083;0.6108;0.7083;0.7108;1.0000" dur="12.0s" repeatCount="indefinite"/><circle r="5" fill="#3fb950"/><animateMotion dur="12.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.6083;0.7083;1" path="M555,245 C615,245 800,200 828,200"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6333;0.6358;0.7333;0.7358;1.0000" dur="12.0s" repeatCount="indefinite"/><circle r="5" fill="#3fb950"/><animateMotion dur="12.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.6333;0.7333;1" path="M705,245 C765,245 800,200 828,200"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.8167;0.8292;0.9833;0.9958;1.0000" dur="12.0s" repeatCount="indefinite"/><text class="bad" x="520" y="360" text-anchor="middle">terminated: you pay only while it ran</text></g><text class="cap" x="30" y="412" opacity=".35"><animate attributeName="opacity" values="0.35;0.35;1;1;0.35;0.35" keyTimes="0.0000;0.0833;0.1042;0.3500;0.3708;1.0000" dur="12.0s" repeatCount="indefinite"/>1  A cluster starts and reads the data from S3 in parallel partitions</text><text class="cap" x="30" y="436" opacity=".35"><animate attributeName="opacity" values="0.35;0.35;1;1;0.35;0.35" keyTimes="0.0000;0.3667;0.3875;0.5500;0.5708;1.0000" dur="12.0s" repeatCount="indefinite"/>2  Spark spreads the work over the worker nodes and shuffles data between them for joins and aggregations</text><text class="cap" x="30" y="460" opacity=".35"><animate attributeName="opacity" values="0.35;0.35;1;1;0.35;0.35" keyTimes="0.0000;0.5667;0.5875;0.7750;0.7958;1.0000" dur="12.0s" repeatCount="indefinite"/>3  The results are written out to S3, a warehouse or an ML pipeline</text><text class="cap" x="30" y="484" opacity=".35"><animate attributeName="opacity" values="0.35;0.35;1;1;0.35;0.35" keyTimes="0.0000;0.8000;0.8208;0.9917;1.0000;1.0000" dur="12.0s" repeatCount="indefinite"/>4  A transient cluster is shut down when the job ends: pay only while it runs</text></svg>
