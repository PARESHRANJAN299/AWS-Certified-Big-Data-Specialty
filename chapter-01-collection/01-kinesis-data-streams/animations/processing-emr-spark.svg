="12.0s" repeatCount="indefinite"/><path d="M495,130 L640,208" stroke="#3d444d" stroke-width="1.5" fill="none"/></g><rect class="node" x="830" y="150" width="120" height="100" rx="12"/><text class="h" x="844" y="198.0">Warehouse</text><text class="s" x="844" y="216.0">BI · ML</text><path d="M190,195 H248" stroke="#3d444d" stroke-width="2" fill="none" marker-end="url(#aw)"/><path d="M790,200 H826" stroke="#3d444d" stroke-width="2" fill="none" marker-end="url(#aw)"/><text class="tiny" x="270" y="316">1 read   2 shuffle   3 write</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0333;0.0458;0.1667;0.1792;1.0000" dur="12.0s" repeatCount="indefinite"/><text class="amb" x="520" y="360" text-anchor="middle">starting the cluster...</text></g><g filter="url(#glow)"><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1833;0.1858;0.2833;0.2858;1.0000" dur="12.0s" repeatCount="indefinite"/><circle r="5" fill="#58a6ff"/><animateMotion dur="12.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1833;0.2833;1" path="M190,195 C230,195 250,245 275,245"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2250;0.2275;0.3250;0.3275;1.0000" dur="12.0s" repeatCount="indefinite"/><circle r="5" fill="#58a6ff"/><animateMotion dur="12.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.2250;0.3250;1" path="M190,195 C230,195 250,245 275,245"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1958;0.1983;0.2958;0.2983;1.0000" dur="12.0s" repeatCount="indefinite"/><circle r="5" fill="#58a6ff"/><animateMotion dur="12.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1958;0.2958;1" path="M190,215 C230,215 250,245 425,245"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2375;0.2400;0.3375;0.3400;1.0000" du