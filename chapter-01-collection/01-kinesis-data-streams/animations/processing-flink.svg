00;1.0000" dur="12.0s" repeatCount="indefinite"/><circle cx="420.0" cy="128" r="7" fill="#58a6ff"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5833;0.5917;0.9917;1.0000;1.0000" dur="12.0s" repeatCount="indefinite"/><circle cx="460.0" cy="178" r="7" fill="#e9a23b"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6250;0.6333;0.9917;1.0000;1.0000" dur="12.0s" repeatCount="indefinite"/><circle cx="480.0" cy="178" r="7" fill="#e9a23b"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7083;0.7167;0.9917;1.0000;1.0000" dur="12.0s" repeatCount="indefinite"/><circle cx="520.0" cy="128" r="7" fill="#58a6ff"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7500;0.7583;0.9917;1.0000;1.0000" dur="12.0s" repeatCount="indefinite"/><circle cx="540.0" cy="178" r="7" fill="#e9a23b"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.8750;0.8833;0.9917;1.0000;1.0000" dur="12.0s" repeatCount="indefinite"/><circle cx="600.0" cy="178" r="7" fill="#e9a23b"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.9167;0.9250;0.9917;1.0000;1.0000" dur="12.0s" repeatCount="indefinite"/><circle cx="620.0" cy="128" r="7" fill="#58a6ff"/></g><g opacity="1"><path d="M0,92 V240" stroke="#3fb950" stroke-width="2" stroke-dasharray="4 4"/><text class="ok" y="86" x="0" text-anchor="middle">watermark</text><animateTransform attributeName="transform" type="translate" values="180,0;650,0" dur="12.0s" repeatCount="indefinite"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3333;0.3458;0.4667;0.4792;1.0000" dur="12.0s" repeatCount="indefinite"/><rect x="220" y="300" width="80" height="26" rx="6" fill="#a371f7"/><text x="260.0" y="317.0" text-anchor="middle" style="font:700 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#0d1117">A=3 B=2</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3417;0.3442;0.4417;0.4442;1.0000" dur="12.0s" repeatCount="indefinite"/><circle r="6" fill="#a371f7"/><animateMotion dur="12.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.3417;0.4417;1" path="M260,300 C260,330 740,330 758,200"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6667;0.6792;0.8000;0.8125;1.0000" dur="12.0s" repeatCount="indefinite"/><rect x="380" y="300" width="80" height="26" rx="6" fill="#a371f7"/><text x="420.0" y="317.0" text-anchor="middle" style="font:700 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#0d1117">A=2 B=3</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6750;0.6775;0.7750;0.7775;1.0000" dur="12.0s" repeatCount="indefinite"/><circle r="6" fill="#a371f7"/><animateMotion dur="12.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.6750;0.7750;1" path="M420,300 C420,330 740,330 758,200"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.9667;0.9792;1.0000;1.0000;1.0000" dur="12.0s" repeatCount="indefinite"/><rect x="540" y="300" width="80" height="26" rx="6" fill="#a371f7"/><text x="580.0" y="317.0" text-anchor="middle" style="font:700 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#0d1117">A=2 B=3</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.9750;0.9775;1.0000;1.0000;1.0000" dur="12.0s" repeatCount="indefinite"/><circle r="6" fill="#a371f7"/><animateMotion dur="12.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.9750;1.0000;1" path="M580,300 C580,330 740,330 758,200"/></g><rect class="panel" x="170" y="296" width="0" height="0"/><rect class="node" x="760" y="150" width="180" height="70" rx="12"/><text class="h" x="774" y="183.0">Dashboard</text><text class="s" x="774" y="201.0">or another stream</text><rect class="node" x="430" y="386" width="290" height="52" rx="12"/><text class="h" x="444" y="410.0">Durable storage (S3)</text><text class="s" x="444" y="428.0">checkpoints of the state</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3333;0.3458;0.4333;0.4458;1.0000" dur="12.0s" repeatCount="indefinite"/><path d="M575,352 V384" stroke="#3fb950" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#ag)"/><text class="ok" x="585" y="372">checkpoint</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6667;0.6792;0.7667;0.7792;1.0000" dur="12.0s" repeatCount="indefinite"/><path d="M575,352 V384" stroke="#3fb950" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#ag)"/><text class="ok" x="585" y="372">checkpoint</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.9667;0.9792;1.0000;1.0000;1.0000" dur="12.0s" repeatCount="indefinite"/><path d="M575,352 V384" stroke="#3fb950" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#ag)"/><text class="ok" x="585" y="372">checkpoint</text></g><text class="tiny" x="170" y="344">state: running counts per key, kept by Flink</text><text class="cap" x="30" y="468" opacity=".35"><animate attributeName="opacity" values="0.35;0.35;1;1;0.35;0.35" keyTimes="0.0000;0.0167;0.0375;0.3333;0.3542;1.0000" dur="12.0s" repeatCount="indefinite"/>1  Events arrive with their own timestamps (event time), not only the time they were received</text><text class="cap" x="30" y="492" opacity=".35"><animate attributeName="opacity" values="0.35;0.35;1;1;0.35;0.35" keyTimes="0.0000;0.1667;0.1875;0.6667;0.6875;1.0000" dur="12.0s" repeatCount="indefinite"/>2  Flink groups them into windows and keeps running state per key (A and B)</text><text class="cap" x="30" y="516" opacity=".35"><animate attributeName="opacity" values="0.35;0.35;1;1;0.35;0.35" keyTimes="0.0000;0.3333;0.3542;1.0000;1.0000;1.0000" dur="12.0s" repeatCount="indefinite"/>3  When the watermark passes the end of a window, that window's result is emitted</text><text class="cap" x="30" y="540" opacity=".35"><animate attributeName="opacity" values="0.35;0.35;1;1;0.35;0.35" keyTimes="0.0000;0.3333;0.3542;1.0000;1.0000;1.0000" dur="12.0s" repeatCount="indefinite"/>4  The state is checkpointed to durable storage, so a failure resumes without losing the counts</text></svg>
