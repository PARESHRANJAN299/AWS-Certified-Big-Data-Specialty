definite"/><rect x="-17" y="-6" width="10" height="12" rx="3" fill="#e3b341"/><rect x="-5" y="-6" width="10" height="12" rx="3" fill="#e3b341"/><rect x="7" y="-6" width="10" height="12" rx="3" fill="#e3b341"/><animateMotion dur="10.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.5300;0.6200;1" path="M470,175 C500,175 520,254 558,254"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6700;0.6730;0.7400;0.7430;1.0000" dur="10.0s" repeatCount="indefinite"/><circle r="6" fill="#3fb950"/><animateMotion dur="10.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.6700;0.7400;1" path="M730,254 H790"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3000;0.3150;0.5200;0.5350;1.0000" dur="10.0s" repeatCount="indefinite"/><circle cx="745" cy="220" r="9" fill="#f85149"/><path d="M741.5,216.5 L748.5,223.5 M748.5,216.5 L741.5,223.5" stroke="#0d1117" stroke-width="2.2" stroke-linecap="round"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3000;0.3150;0.5200;0.5350;1.0000" dur="10.0s" repeatCount="indefinite"/><text class="bad" x="748" y="238">fails</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5300;0.5450;0.7400;0.7550;1.0000" dur="10.0s" repeatCount="indefinite"/><text class="amb" x="645" y="300" text-anchor="middle">retry the same batch</text></g><text class="cap" x="30" y="336" opacity=".35"><animate attributeName="opacity" values="0.35;0.35;1;1;0.35;0.35" keyTimes="0.0000;0.0200;0.0450;0.2900;0.3150;1.0000" dur="10.0s" repeatCount="indefinite"/>1  Lambda polls each shard and hands the records to your function in batches</text><text class="cap" x="30" y="360" opacity=".35"><animate attributeName="opacity" values="0.35;0.35;1;1;0.35;0.35" keyTimes="0.0000;0.1600;0.1850;0.3900;0.4150;1.0000" dur="10.0s" repeatCount="indefinite"/>2  Shards run in parallel: by default about one invocation at a time per shard</text><text class="cap" x="30" y="384" opacity=".35"><animate attributeName="opacity" values="0.35;0.35;1;1;0.35;0.35" keyTimes="0.0000;0.3000;0.3250;0.7600;0.7850;1.0000" dur="10.0s" repeatCount="indefinite"/>3  If a batch fails, Lambda retries it. Order inside a shard is kept, so one bad batch can hold up its shard</text><text class="cap" x="30" y="408" opacity=".35"><animate attributeName="opacity" values="0.35;0.35;1;1;0.35;0.35" keyTimes="0.0000;0.5300;0.5550;0.9800;1.0000;1.0000" dur="10.0s" repeatCount="indefinite"/>4  Settings that help: batch size, retry limits, split the batch on error, partial batch response, a failure destination</text></svg>
