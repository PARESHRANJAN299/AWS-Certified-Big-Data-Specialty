<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-labelledby="t d"><title id="t">Lambda reading from Kinesis</title><desc id="d">Lambda polls each shard and sends batches of records to function invocations in parallel. A failed batch is retried.</desc><defs><style>
