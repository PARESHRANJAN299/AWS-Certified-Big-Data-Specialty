eMotion dur="12.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.2083;0.3250;1" path="M330,482 H400 M570,482 H640"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5833;0.5858;0.7000;0.7025;1.0000" dur="12.0s" repeatCount="indefinite"/><circle r="5" fill="#3fb950"/><animateMotion dur="12.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.5833;0.7000;1" path="M330,482 H400 M570,482 H640"/></g></g><text class="cap" x="30" y="570" opacity=".35"><animate attributeName="opacity" values="0.35;0.35;1;1;0.35;0.35" keyTimes="0.0000;0.0167;0.0175;0.9833;0.9842;1.0000" dur="12.0s" repeatCount="indefinite"/>One stream, many engines: each branch fits a different job, and none of them blocks the others</text><text class="mid" x="30" y="594">Hot path: seconds. Cold path: batch. Kinesis lets every branch read the same data independently.</text></svg>
