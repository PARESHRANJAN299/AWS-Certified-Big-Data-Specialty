<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 610" width="960" height="610" role="img" aria-labelledby="t d"><title id="t">Reference architecture: one stream, many engines</title><desc id="d">Producers write to Kinesis Data Streams. Lambda handles light event actions, Managed Flink does stateful real-time analytics, Firehose lands data in S3 for EMR and Spark batch jobs, and an ECS application runs custom logic.</desc><defs><style>
 .bg{fill:#0d1117} .node{fill:#161b22;stroke:#30363d;stroke-width:1.5} .big{fill:#161b22;stroke:#e9a23b;stroke-width:2} .panel{fill:#11161d;stroke:#30363d;stroke-width:1.5}
 .t{font:700 18px "Segoe UI",Helvetica,Arial,sans-serif;fill:#e6edf3} .s{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#8b949e} .h{font:700 15px "Segoe UI",Helvetica,Arial,sans-serif;fill:#e6edf3}
 .put{font:700 15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#58a6ff} .get{font:700 15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#e3b341} .ok{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#3fb950} .bad{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#f85149} .amb{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#e3b341}
 .pk{font:700 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace} .cap{font:13px "Segoe UI",Helvetica,Arial,sans-serif;fill:#e6edf3} .tiny{font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#7d8590} .mid{font:12px "Segoe UI",Helvetica,Arial,sans-serif;fill:#aab4c0}
 .slot{fill:#0d1117;stroke:#30363d;stroke-width:1.5;stroke-dasharray:3 3} .lane{fill:none;stroke-width:2.5}
 .gone{fill:#0d1117;stroke:#4b4f55;stroke-width:1.5;stroke-dasharray:4 4}
</style><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#58a6ff"/></marker><marker id="ay" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e3b341"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3fb950"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f85149"/></marker><marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b949e"/></marker><filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect class="bg" width="960" height="610" rx="16"/><rect class="node" x="20" y="245" width="130" height="96" rx="14"/><text class="h" x="85.0" y="291.0" text-anchor="middle">Producers</text><text class="s" x="85.0" y="313.0" text-anchor="middle">apps · clicks · IoT</text><rect class="big" x="190" y="40" width="140" height="500" rx="14"/><text class="t" x="260" y="270" text-anchor="middle">Kinesis</text><text class="s" x="260" y="292" text-anchor="middle">Data Streams</text><text class="tiny" x="260" y="312" text-anchor="middle">the shared buffer</text><path class="lane" stroke="#58a6ff" d="M150,293 H188" marker-end="url(#ab)"/><path d="M330,82 H398" stroke="#3d444d" stroke-width="2" fill="none" marker-end="url(#aw)"/><rect class="node" x="400" y="50" width="170" height="64" rx="12"/><text class="h" x="416" y="79.0">AWS Lambda</text><text class="s" x="416" y="98.0">light event actions</text><rect x="400" y="64" width="4" height="36" rx="2" fill="#e3b341"/><path d="M570,82 H638" stroke="#3d444d" stroke-width="2" fill="none" marker-end="url(#aw)"/><rect class="node" x="640" y="50" width="290" height="64" rx="12"/><text class="h" x="656" y="79.0">DynamoDB · alerts (SNS)</text><text class="s" x="656" y="98.0"></text><text class="tiny" x="400" y="132" style="fill:#3fb950">latency: milliseconds to seconds</text><path d="M330,177 H398" stroke="#3d444d" stroke-width="2" fill="none" marker-end="url(#aw)"/><rect class="node" x="400" y="145" width="170" height="64" rx="12"/><text class="h" x="416" y="174.0">Managed Flink</text><text class="s" x="416" y="193.0">stateful real time</text><rect x="400" y="159" width="4" height="36" rx="2" fill="#a371f7"/><path d="M570,177 H638" stroke="#3d444d" stroke-width="2" fill="none" marker-end="url(#aw)"/><rect class="node" x="640" y="145" width="290" height="64" rx="12"/><text class="h" x="656" y="174.0">Dashboards · S3 · next stream</text><text class="s" x="656" y="193.0"></text><text class="tiny" x="400" y="227" style="fill:#3fb950">latency: seconds</text><path d="M330,272 H398" stroke="#3d444d" stroke-width="2" fill="none" marker-end="url(#aw)"/><rect class="node" x="400" y="240" width="170" height="64" rx="12"/><text class="h" x="416" y="269.0">Firehose</text><text class="s" x="416" y="288.0">batch delivery to S3</text><rect x="400" y="254" width="4" height="36" rx="2" fill="#e9a23b"/><text class="tiny" x="400" y="322" style="fill:#58a6ff">latency: minutes</text><path d="M330,482 H398" stroke="#3d444d" stroke-width="2" fill="none" marker-end="url(#aw)"/><rect class="node" x="400" y="450" width="170" height="64" rx="12"/><text class="h" x="416" y="479.0">ECS (KCL app)</text><text class="s" x="416" y="498.0">custom logic</text><rect x="400" y="464" width="4" height="36" rx="2" fill="#3fb950"/><path d="M570,482 H638" stroke="#3d444d" stroke-width="2" fill="none" marker-end="url(#aw)"/><rect class="node" x="640" y="450" width="290" height="64" rx="12"/><text class="h" x="656" y="479.0">Internal services</text><text class="s" x="656" y="498.0"></text><text class="tiny" x="400" y="532" style="fill:#8b949e">latency: you decide</text><path d="M570,272 H638" stroke="#3d444d" stroke-width="2" fill="none" marker-end="url(#aw)"/><rect class="node" x="640" y="240" width="140" height="64" rx="12"/><text class="h" x="656" y="269.0">S3</text><text class="s" x="656" y="288.0">data lake</text><path d="M710,304 V333" stroke="#3d444d" stroke-width="2" fill="none" marker-end="url(#aw)"/><rect class="node" x="640" y="335" width="140" height="64" rx="12"/><text class="h" x="656" y="364.0">EMR / Spark</text><text class="s" x="656" y="383.0">heavy batch</text><rect x="640" y="349" width="4" height="36" rx="2" fill="#f85149"/><path d="M780,367 H818" stroke="#3d444d" stroke-width="2" fill="none" marker-end="url(#aw)"/><rect class="node" x="820" y="335" width="120" height="64" rx="12"/><text class="h" x="836" y="364.0">Warehouse</text><text class="s" x="836" y="383.0">BI · ML</text><text class="tiny" x="640" y="417" style="fill:#58a6ff">latency: minutes to hours</text><g filter="url(#glow)"><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0083;0.0108;0.0583;0.0608;1.0000" dur="12.0s" repeatCount="indefinite"/><circle r="5" fill="#58a6ff"/><animateMotion dur="12.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0083;0.0583;1" path="M150,293 H190"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1333;0.1358;0.1833;0.1858;1.0000" dur="12.0s" repeatCount="indefinite"/><circle r="5" fill="#58a6ff"/><animateMotion dur="12.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1333;0.1833;1" path="M150,293 H190"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2583;0.2608;0.3083;0.3108;1.0000" dur="12.0s" repeatCount="indefinite"/><circle r="5" fill="#58a6ff"/><animateMotion dur="12.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.2