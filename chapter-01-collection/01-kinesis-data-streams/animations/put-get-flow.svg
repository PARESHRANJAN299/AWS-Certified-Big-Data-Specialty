<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-labelledby="t d">
  <title id="t">Producer PUT into Kinesis, Consumer GET from Kinesis</title>
  <desc id="d">A producer sends events into Kinesis with PUT. Kinesis keeps them. Later a consumer asks Kinesis for data with GET and the events come back to the consumer.</desc>
  <defs><style>
      .bg{fill:#0d1117} .node{fill:#161b22;stroke:#30363d;stroke-width:1.5} .big{fill:#161b22;stroke:#e9a23b;stroke-width:2}
      .t{font:700 20px "Segoe UI",Helvetica,Arial,sans-serif;fill:#e6edf3} .s{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#8b949e}
      .put{font:700 17px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#58a6ff} .get{font:700 17px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#e3b341} .ret{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#3fb950}
      .pk{font:700 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace} .cap{font:13px "Segoe UI",Helvetica,Arial,sans-serif;fill:#e6edf3} .tiny{font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#7d8590}
      .slot{fill:#0d1117;stroke:#30363d;stroke-width:1.5;stroke-dasharray:3 3}
      .lane{fill:none;stroke-width:2.5}
</style>
    <marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#58a6ff"/></marker>
    <marker id="ay" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e3b341"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3fb950"/></marker>
    <marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b949e"/></marker>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect class="bg" width="960" height="330" rx="16"/>
  <rect class="node" x="40" y="70" width="200" height="110" rx="14"/><text class="t" x="140.0" y="123.0" text-anchor="middle">Producer</text><text class="s" x="140.0" y="145.0" text-anchor="middle">sends data</text>
  <rect class="big" x="370" y="50" width="220" height="150" rx="14"/><text class="t" x="480.0" y="88" text-anchor="middle">Kinesis</text><text class="s" x="480.0" y="108" text-anchor="middle">Data Streams</text><text class="tiny" x="480.0" y="136" text-anchor="middle">events wait here</text>
  <rect class="node" x="720" y="70" width="200" height="110" rx="14"/><text class="t" x="820.0" y="123.0" text-anchor="middle">Consumer</text><text class="s" x="820.0" y="145.0" text-anchor="middle">reads data</text>
  <rect class="slot" x="392" y="150" width="38" height="26" rx="6"/><rect class="slot" x="438" y="150" width="38" height="26" rx="6"/><rect class="slot" x="484" y="150" width="38" height="26" rx="6"/><rect class="slot" x="530" y="150" width="38" height="26" rx="6"/>
  <path class="lane" stroke="#58a6ff" d="M240,118 H368" marker-end="url(#ab)"/>
  <text class="put" x="304" y="100" text-anchor="middle">PUT</text>
  <path class="lane" stroke="#e3b341" d="M720,104 H592" marker-end="url(#ay)"/>
  <text class="get" x="656" y="86" text-anchor="middle">GET</text>
  <path d="M592,160 H720" fill="none" stroke="#3fb950" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#ag)"/>
  <text class="ret" x="656" y="184" text-anchor="middle">events come back</text>
  <g filter="url(#glow)">
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0250;0.0263;0.1500;0.1512;1.0000" dur="8.0s" repeatCount="indefinite"/><circle r="7" fill="#58a6ff"/><animateMotion dur="8.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0250;0.1500;1" path="M240,118 H368"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2250;0.2263;0.3500;0.3512;1.0000" dur="8.0s" repeatCount="indefinite"/><circle r="7" fill="#58a6ff"/><animateMotion dur="8.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.2250;0.3500;1" path="M240,118 H368"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4250;0.4262;0.5500;0.5513;1.0000" dur="8.0s" repeatCount="indefinite"/><circle r="7" fill="#58a6ff"/><animateMotion dur="8.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.4250;0.5500;1" path="M240,118 H368"/></g>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6000;0.6012;0.7000;0.7012;1.0000" dur="8.0s" repeatCount="indefinite"/><circle r="7" fill="#e3b341"/><text y="-10" text-anchor="middle" class="pk" style="fill:#e3b341">GET?</text><animateMotion dur="8.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.6000;0.7000;1" path="M720,104 H592"/></g>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7250;0.7262;0.8500;0.8512;1.0000" dur="8.0s" repeatCount="indefinite"/><circle r="7" fill="#3fb950"/><animateMotion dur="8.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.7250;0.8500;1" path="M592,160 H720"/></g>
  </g>
  <rect x="392" y="150" width="38" height="26" rx="6" fill="#58a6ff" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1500;0.1687;0.7250;0.7438;1.0000" dur="8.0s" repeatCount="indefinite"/></rect><rect x="438" y="150" width="38" height="26" rx="6" fill="#58a6ff" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3500;0.3687;0.9125;0.9313;1.0000" dur="8.0s" repeatCount="indefinite"/></rect><rect x="484" y="150" width="38" height="26" rx="6" fill="#58a6ff" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5500;0.5688;0.9125;0.9313;1.0000" dur="8.0s" repeatCount="indefinite"/></rect>
  <text class="cap" x="40" y="262" opacity=".3"><animate attributeName="opacity" values="0.3;0.3;1;1;0.3;0.3" keyTimes="0.0000;0.0125;0.0437;0.5750;0.6062;1.0000" dur="8.0s" repeatCount="indefinite"/>1  The Producer PUTs events into Kinesis</text>
  <text class="cap" x="40" y="286" opacity=".3"><animate attributeName="opacity" values="0.3;0.3;1;1;0.3;0.3" keyTimes="0.0000;0.1500;0.1812;0.6250;0.6562;1.0000" dur="8.0s" repeatCount="indefinite"/>2  Kinesis keeps them until a Consumer is ready</text>
  <text class="cap" x="40" y="310" opacity=".3"><animate attributeName="opacity" values="0.3;0.3;1;1;0.3;0.3" keyTimes="0.0000;0.5875;0.6188;0.9125;0.9437;1.0000" dur="8.0s" repeatCount="indefinite"/>3  The Consumer asks with GET and the events come back</text>
</svg>
