<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-labelledby="t d"><title id="t">PutRecord versus PutRecords</title><desc id="d">PutRecord sends one record per call. PutRecords sends a batch in one call, can partly fail, and the producer retries only the failed records.</desc><defs><style>
 .bg{fill:#0d1117} .node{fill:#161b22;stroke:#30363d;stroke-width:1.5} .big{fill:#161b22;stroke:#e9a23b;stroke-width:2} .panel{fill:#11161d;stroke:#30363d;stroke-width:1.5}
 .t{font:700 18px "Segoe UI",Helvetica,Arial,sans-serif;fill:#e6edf3} .s{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#8b949e} .h{font:700 15px "Segoe UI",Helvetica,Arial,sans-serif;fill:#e6edf3}
 .put{font:700 15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#58a6ff} .get{font:700 15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#e3b341} .ok{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#3fb950} .bad{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#f85149} .amb{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#e3b341}
 .pk{font:700 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace} .cap{font:13px "Segoe UI",Helvetica,Arial,sans-serif;fill:#e6edf3} .tiny{font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#7d8590} .mid{font:12px "Segoe UI",Helvetica,Arial,sans-serif;fill:#aab4c0}
 .slot{fill:#0d1117;stroke:#30363d;stroke-width:1.5;stroke-dasharray:3 3} .lane{fill:none;stroke-width:2.5}
 .gone{fill:#0d1117;stroke:#4b4f55;stroke-width:1.5;stroke-dasharray:4 4}
</style><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#58a6ff"/></marker><marker id="ay" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e3b341"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3fb950"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f85149"/></marker><marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b949e"/></marker><filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect class="bg" width="960" height="480" rx="16"/><rect class="node" x="30" y="60" width="140" height="290" rx="14"/><text class="t" x="100.0" y="211.0" text-anchor="middle">Producer</text><rect class="big" x="770" y="60" width="160" height="290" rx="14"/><text class="t" x="850" y="215" text-anchor="middle">Kinesis</text><text class="s" x="850" y="236" text-anchor="middle">stream</text><text class="h" x="470" y="92" text-anchor="middle">PutRecord: one record per call</text><path class="lane" stroke="#58a6ff" d="M170,120 H768" marker-end="url(#ab)"/><text class="h" x="470" y="222" text-anchor="middle">PutRecords: many records in one call</text><path class="lane" stroke="#58a6ff" d="M170,260 H768" marker-end="url(#ab)"/><path d="M768,310 H170" fill="none" stroke="#8b949e" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#aw)"/><text class="tiny" x="470" y="332" text-anchor="middle">the answer comes back: which records worked</text><g filter="url(#glow)"><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0250;0.0275;0.1250;0.1275;1.0000" dur="12.0s" repeatCount="indefinite"/><circle r="7" fill="#58a6ff"/><text y="-12" text-anchor="middle" class="pk" style="fill:#58a6ff">1 call, 1 record</text><animateMotion dur="12.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0250;0.1250;1" path="M172,120 H766"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1417;0.1442;0.2417;0.2442;1.0000" dur="12.0s" repeatCount="indefinite"/><circle r="7" fill="#58a6ff"/><animateMotion dur="12.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1417;0.2417;1" path="M172,120 H766"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2583;0.2608;0.3583;0.3608;1.0000" dur="12.0s" repeatCount="indefinite"/><circle r="7" fill="#58a6ff"/><animateMotion dur="12.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.2583;0.3583;1" path="M172,120 H766"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3833;0.3858;0.5000;0.5025;1.0000" dur="12.0s" repeatCount="indefinite"/><rect x="-50" y="-8" width="16" height="16" rx="4" fill="#58a6ff"/><rect x="-30" y="-8" width="16" height="16" rx="4" fill="#58a6ff"/><rect x="-10" y="-8" width="16" height="16" rx="4" fill="#58a6ff"/><rect x="10" y="-8" width="16" height="16" rx="4" fill="#58a6ff"/><rect x="30" y="-8" width="16" height="16" rx="4" fill="#58a6ff"/><text y="-16" text-anchor="middle" class="pk" style="fill:#58a6ff">1 call, 5 records</text><animateMotion dur="12.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.3833;0.5000;1" path="M172,260 H766"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5250;0.5275;0.6250;0.6275;1.0000" dur="12.0s" repeatCount="indefinite"/><circle cx="-48" cy="0" r="9" fill="#3fb950"/><path d="M-52,0 L-49,3.5 L-43,-4" fill="none" stroke="#0d1117" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-24" cy="0" r="9" fill="#3fb950"/><path d="M-28,0 L-25,3.5 L-19,-4" fill="none" stroke="#0d1117" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="0" cy="0" r="9" fill="#f85149"/><path d="M-3.5,-3.5 L3.5,3.5 M3.5,-3.5 L-3.5,3.5" stroke="#0d1117" stroke-width="2.2" stroke-linecap="round"/><circle cx="24" cy="0" r="9" fill="#3fb950"/><path d="M20,0 L23,3.5 L29,-4" fill="none" stroke="#0d1117" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="48" cy="0" r="9" fill="#3fb950"/><path d="M44,0 L47,3.5 L53,-4" fill="none" stroke="#0d1117" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text y="-18" text-anchor="middle" class="pk" style="fill:#8b949e">the answer</text><animateMotion dur="12.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.5250;0.6250;1" path="M766,310 H172"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6833;0.6858;0.7833;0.7858;1.0000" dur="12.0s" repeatCount="indefinite"/><rect x="-8" y="-8" width="16" height="16" rx="4" fill="#f85149"/><text y="-16" text-anchor="middle" class="pk" style="fill:#e3b341">retry only the failed one</text><animateMotion dur="12.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.6833;0.7833;1" path="M172,260 H766"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.8167;0.8192;0.9000;0.9025;1.0000" dur="12.0s" repeatCount="indefinite"/><circle cx="0" cy="0" r="9" fill="#3fb950"/><path d="M-4,0 L-1,3.5 L5,-4" fill="none" stroke="#0d1117" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><animateMotion dur="12.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.8167;0.9000;1" path="M766,310 H172"/></g></g><text class="cap" x="30" y="384" opacity=".35"><animate attributeName="opacity" values="0.35;0.35;1;1;0.35;0.35" keyTimes="0.0000;0.0167;0.0375;0.3667;0.3875;1.0000" dur="12.0s" repeatCount="indefinite"/>1  PutRecord sends one record per call</text><text class="cap" x="30" y="408" opacity=".35"><animate attributeName="opacity" values="0.35;0.35;1;1;0.35;0.35" keyTimes="0.0000;0.3750;0.3958;0.5167;0.5375;1.0000" dur="12.0s" repeatCount="indefinite"/>2  PutRecords sends a batch of records in a single call, so there are fewer calls</text><text class="cap" x="30" y="432" opacity=".35"><animate attributeName="opacity" values="0.35;0.35;1;1;0.35;0.35" keyTimes="0.0000;0.5250;0.5458;0.6750;0.6958;1.0000" dur="12.0s" repeatCount="indefinite"/>3  Partial failure: the call can succeed while some records in the batch fail</text><text class="cap" x="30" y="456" opacity=".35"><animate attributeName="opacity" values="0.35;0.35;1;1;0.35;0.35" keyTimes="0.0000;0.6833;0.7042;0.9167;0.9375;1.0000" dur="12.0s" repeatCount="indefinite"/>4  Retry only the records that failed, not the whole batch</text></svg>
