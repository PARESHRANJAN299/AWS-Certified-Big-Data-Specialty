<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-labelledby="t d"><title id="t">Retention and replay</title><desc id="d">Records are kept for the retention period. A consumer can replay from an earlier retained record, but not from one that has expired.</desc><defs><style>
 .bg{fill:#0d1117} .node{fill:#161b22;stroke:#30363d;stroke-width:1.5} .big{fill:#161b22;stroke:#e9a23b;stroke-width:2} .panel{fill:#11161d;stroke:#30363d;stroke-width:1.5}
 .t{font:700 18px "Segoe UI",Helvetica,Arial,sans-serif;fill:#e6edf3} .s{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#8b949e} .h{font:700 15px "Segoe UI",Helvetica,Arial,sans-serif;fill:#e6edf3}
 .put{font:700 15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#58a6ff} .get{font:700 15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#e3b341} .ok{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#3fb950} .bad{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#f85149} .amb{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#e3b341}
 .pk{font:700 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace} .cap{font:13px "Segoe UI",Helvetica,Arial,sans-serif;fill:#e6edf3} .tiny{font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#7d8590} .mid{font:12px "Segoe UI",Helvetica,Arial,sans-serif;fill:#aab4c0}
 .slot{fill:#0d1117;stroke:#30363d;stroke-width:1.5;stroke-dasharray:3 3} .lane{fill:none;stroke-width:2.5}
 .gone{fill:#0d1117;stroke:#4b4f55;stroke-width:1.5;stroke-dasharray:4 4}
</style><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#58a6ff"/></marker><marker id="ay" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e3b341"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3fb950"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f85149"/></marker><marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b949e"/></marker><filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect class="bg" width="960" height="430" rx="16"/><text class="h" x="60" y="52">Records, oldest on the left, newest on the right</text><rect class="gone" x="60" y="110" width="52" height="44" rx="8"/><text class="tiny" x="86.0" y="136" text-anchor="middle">1</text><rect class="gone" x="120" y="110" width="52" height="44" rx="8"/><text class="tiny" x="146.0" y="136" text-anchor="middle">2</text><g><rect x="180" y="110" width="52" height="44" rx="8" fill="#12304f" stroke="#2f81d8" stroke-width="1.5"><animate attributeName="opacity" values="1;0;0" keyTimes="0.0000;0.1667;1.0000" dur="12.0s" repeatCount="indefinite" calcMode="discrete"/></rect><text x="206.0" y="137" text-anchor="middle" style="font:700 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#c9d1d9">3<animate attributeName="opacity" values="1;0;0" keyTimes="0.0000;0.1667;1.0000" dur="12.0s" repeatCount="indefinite" calcMode="discrete"/></text><rect class="gone" x="180" y="110" width="52" height="44" rx="8" opacity="0"><animate attributeName="opacity" values="0;1;1" keyTimes="0.0000;0.1667;1.0000" dur="12.0s" repeatCount="indefinite" calcMode="discrete"/></rect><text class="tiny" x="206.0" y="136" text-anchor="middle" opacity="0"><animate attributeName="opacity" values="0;1;1" keyTimes="0.0000;0.1667;1.0000" dur="12.0s" repeatCount="indefinite" calcMode="discrete"/>3</text></g><g><rect x="240" y="110" width="52" height="44" rx="8" fill="#12304f" stroke="#2f81d8" stroke-width="1.5"><animate attributeName="opacity" values="1;0;0" keyTimes="0.0000;0.3333;1.0000" dur="12.0s" repeatCount="indefinite" calcMode="discrete"/></rect><text x="266.0" y="137" text-anchor="middle" style="font:700 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#c9d1d9">4<animate attributeName="opacity" values="1;0;0" keyTimes="0.0000;0.3333;1.0000" dur="12.0s" repeatCount="indefinite" calcMode="discrete"/></text><rect class="gone" x="240" y="110" width="52" height="44" rx="8" opacity="0"><animate attributeName="opacity" values="0;1;1" keyTimes="0.0000;0.3333;1.0000" dur="12.0s" repeatCount="indefinite" calcMode="discrete"/></rect><text class="tiny" x="266.0" y="136" text-anchor="middle" opacity="0"><animate attributeName="opacity" values="0;1;1" keyTimes="0.0000;0.3333;1.0000" dur="12.0s" repeatCount="indefinite" calcMode="discrete"/>4</text></g><g><rect x="300" y="110" width="52" height="44" rx="8" fill="#12304f" stroke="#2f81d8" stroke-width="1.5"><animate attributeName="opacity" values="1;0;0" keyTimes="0.0000;0.5000;1.0000" dur="12.0s" repeatCount="indefinite" calcMode="discrete"/></rect><text x="326.0" y="137" text-anchor="middle" style="font:700 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#c9d1d9">5<animate attributeName="opacity" values="1;0;0" keyTimes="0.0000;0.5000;1.0000" dur="12.0s" repeatCount="indefinite" calcMode="discrete"/></text><rect class="gone" x="300" y="110" width="52" height="44" rx="8" opacity="0"><animate attributeName="opacity" values="0;1;1" keyTimes="0.0000;0.5000;1.0000" dur="12.0s" repeatCount="indefinite" calcMode="discrete"/></rect><text class="tiny" x="326.0" y="136" text-anchor="middle" opacity="0"><animate attributeName="opacity" values="0;1;1" keyTimes="0.0000;0.5000;1.0000" dur="12.0s" repeatCount="indefinite" calcMode="discrete"/>5</text></g><g><rect x="360" y="110" width="52" height="44" rx="8" fill="#12304f" stroke="#2f81d8" stroke-width="1.5"><animate attributeName="opacity" values="1;0;0" keyTimes="0.0000;0.6667;1.0000" dur="12.0s" repeatCount="indefinite" calcMode="discrete"/></rect><text x="386.0" y="137" text-anchor="middle" style="font:700 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#c9d1d9">6<animate attributeName="opacity" values="1;0;0" keyTimes="0.0000;0.6667;1.0000" dur="12.0s" repeatCount="indefinite" calcMode="discrete"/></text><rect class="gone" x="360" y="110" width="52" height="44" rx="8" opacity="0"><animate attributeName="opacity" values="0;1;1" keyTimes="0.0000;0.6667;1.0000" dur="12.0s" repeatCount="indefinite" calcMode="discrete"/></rect><text class="tiny" x="386.0" y="136" text-anchor="middle" opacity="0"><animate attributeName="opacity" values="0;1;1" keyTimes="0.0000;0.6667;1.0000" dur="12.0s" repeatCount="indefinite" calcMode="discrete"/>6</text></g><rect x="420" y="110" width="52" height="44" rx="8" fill="#12304f" stroke="#2f81d8" stroke-width="1.5"/><text x="446.0" y="137" text-anchor="middle" style="font:700 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#c9d1d9">7</text><rect x="480" y="110" width="52" height="44" rx="8" fill="#12304f" stroke="#2f81d8" stroke-width="1.5"/><text x="506.0" y="137" text-anchor="middle" style="font:700 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#c9d1d9">8</text><rect x="540" y="110" width="52" height="44" rx="8" fill="#12304f" stroke="#2f81d8" stroke-width="1.5"/><text x="566.0" y="137" text-anchor="middle" style="font:700 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#c9d1d9">9</text><rect x="600" y="110" width="52" height="44" rx="8" fill="#12304f" stroke="#2f81d8" stroke-width="1.5"/><text x="626.0" y="137" text-anchor="middle" style="font:700 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#c9d1d9">10</text><rect class="slot" x="660" y="110" width="52" height="44" rx="8"/><g opacity="0"><animate attributeName="opacity" values="0;1;1" keyTimes="0.0000;0.1667;1.0000" dur="12.0s" repeatCount="indefinite" calcMode="discrete"/><rect x="660" y="110" width="52" height="44" rx="8" fill="#12304f" stroke="#2f81d8" stroke-width="1.5"/><text x="686.0" y="137" text-anchor="middle" style="font:700 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#c9d1d9">11</text></g><rect class="slot" x="720" y="110" width="52" height="44" rx="8"/><g opacity="0"><animate attributeName="opacity" values="0;1;1" keyTimes="0.0000;0.3333;1.0000" dur="12.0s" repeatCount="indefinite" calcMode="discrete"/><rect x="720" y="110" width="52" height="44" rx="8" fill="#12304f" stroke="#2f81d8" stroke-width="1.5"/><text x="746.0" y="137" text-anchor="middle" style="font:700 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#c9d1d9">12</text></g><rect class="slot" x="780" y="110" width="52" height="44" rx="8"/><g opacity="0"><animate attributeName="opacity" values="0;1;1" keyTimes="0.0000;0.5000;1.0000" dur="12.0s" repeatCount="indefinite" calcMode="discrete"/><rect x="780" y="110" width="52" height="44" rx="8" fill="#12304f" stroke="#2f81d8" stroke-width="1.5"/><text x="806.0" y="137" text-anchor="middle" style="font:700 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#c9d1d9">13</text></g><rect class="slot" x="840" y="110" width="52" height="44" rx="8"/><g opacity="0"><animate attributeName="opacity" values="0;1;1" keyTimes="0.0000;0.6667;1.0000" dur="12.0s" repeatCount="indefinite" calcMode="discrete"/><rect x="840" y="110" width="52" height="44" rx="8" fill="#12304f" stroke="#2f81d8" stroke-width="1.5"/><text x="866.0" y="137" text-anchor="middle" style="font:700 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#c9d1d9">14</text></g><rect y="100" width="472" height="64" rx="12" fill="none" stroke="#3fb950" stroke-width="2" stroke-dasharray="6 4" x="176"><animate attributeName="x" values="176;236;296;356;416;416" keyTimes="0.0000;0.1667;0.3333;0.5000;0.6667;1.0000" dur="12.0s" repeatCount="indefinite" calcMode="discrete"/></rect><text class="ok" x="60" y="192">retention window: the records Kinesis still keeps</text><text class="tiny" x="146.0" y="90" text-anchor="middle">expired</text><g><path d="M0,0 L-9,16 L9,16 z" fill="#e3b341"/><text y="34" text-anchor="middle" class="amb">consumer</text><animateTransform attributeName="transform" type="translate" values="506.0,162;830.0,162;830.0,162;446.0,162;578.0,162" keyTimes="0.0000;0.7167;0.7500;0.8167;1.0000" dur="12.0s" repeatCount="indefinite"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7500;0.7625;0.9167;0.9292;1.0000" dur="12.0s" repeatCount="indefinite"/><text class="amb" x="480" y="240" text-anchor="middle">replay: go back to an earlier retained record and read again</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.8583;0.8708;0.9917;1.0000;1.0000" dur="12.0s" repeatCount="indefinite"/><text class="bad" x="480" y="268" text-anchor="middle">record 3 has expired: it cannot be replayed</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.8583;0.8708;0.9917;1.0000;1.0000" dur="12.0s" repeatCount="indefinite"/><rect x="180" y="110" width="52" height="44" rx="8" fill="none" stroke="#f85149" stroke-width="2.5"/></g><text class="cap" x="60" y="338" opacity=".35"><animate attributeName="opacity" values="0.35;0.35;1;1;0.35;0.35" keyTimes="0.0000;0.0167;0.0375;0.4583;0.4792;1.0000" dur="12.0s" repeatCount="indefinite"/>1  New records arrive on the right. Kinesis keeps each one for the retention period.</text><text class="cap" x="60" y="362" opacity=".35"><animate attributeName="opacity" values="0.35;0.35;1;1;0.35;0.35" keyTimes="0.0000;0.1667;0.1875;0.7000;0.7208;1.0000" dur="12.0s" repeatCount="indefinite"/>2  A record older than the retention period expires and is gone from Kinesis.</text><text class="cap" x="60" y="386" opacity=".35"><animate attributeName="opacity" values="0.35;0.35;1;1;0.35;0.35" keyTimes="0.0000;0.7500;0.7708;0.8583;0.8792;1.0000" dur="12.0s" repeatCount="indefinite"/>3  Replay: the consumer goes back to an earlier record that is still kept, and reads again from there.</text><text class="cap" x="60" y="410" opacity=".35"><animate attributeName="opacity" values="0.35;0.35;1;1;0.35;0.35" keyTimes="0.0000;0.8583;0.8792;0.9917;1.0000;1.0000" dur="12.0s" repeatCount="indefinite"/>4  A record that has already expired cannot be replayed.</text></svg>
