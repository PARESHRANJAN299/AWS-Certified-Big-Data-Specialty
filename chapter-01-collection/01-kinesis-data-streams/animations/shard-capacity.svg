<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d"><title id="t">Shard capacity and throttling</title><desc id="d">A shard accepts around 1 MB per second and 1,000 records per second. When a producer sends more, extra writes are rejected and the producer retries them.</desc><defs><style>
 .bg{fill:#0d1117} .node{fill:#161b22;stroke:#30363d;stroke-width:1.5} .big{fill:#161b22;stroke:#e9a23b;stroke-width:2} .panel{fill:#11161d;stroke:#30363d;stroke-width:1.5}
 .t{font:700 18px "Segoe UI",Helvetica,Arial,sans-serif;fill:#e6edf3} .s{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#8b949e} .h{font:700 15px "Segoe UI",Helvetica,Arial,sans-serif;fill:#e6edf3}
 .put{font:700 15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#58a6ff} .get{font:700 15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#e3b341} .ok{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#3fb950} .bad{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#f85149} .amb{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#e3b341}
 .pk{font:700 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace} .cap{font:13px "Segoe UI",Helvetica,Arial,sans-serif;fill:#e6edf3} .tiny{font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#7d8590} .mid{font:12px "Segoe UI",Helvetica,Arial,sans-serif;fill:#aab4c0}
 .slot{fill:#0d1117;stroke:#30363d;stroke-width:1.5;stroke-dasharray:3 3} .lane{fill:none;stroke-width:2.5}
 .gone{fill:#0d1117;stroke:#4b4f55;stroke-width:1.5;stroke-dasharray:4 4}
</style><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#58a6ff"/></marker><marker id="ay" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e3b341"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3fb950"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f85149"/></marker><marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b949e"/></marker><filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect class="bg" width="960" height="420" rx="16"/><rect class="node" x="30" y="120" width="150" height="100" rx="14"/><text class="t" x="105.0" y="168.0" text-anchor="middle">Producer</text><text class="s" x="105.0" y="190.0" text-anchor="middle">writes records</text><rect class="big" x="380" y="40" width="270" height="270" rx="14"/><text class="t" x="515" y="78" text-anchor="middle">One shard</text><text class="s" x="515" y="100" text-anchor="middle">writes in: around 1 MB/s</text><text class="s" x="515" y="118" text-anchor="middle">and 1,000 records/s</text><text class="tiny" x="400" y="160">write load</text><rect x="400" y="168" width="230" height="18" rx="9" fill="#1c2128"/><rect x="400" y="168" width="0" height="18" rx="9" fill="#58a6ff"><animate attributeName="width" values="0;0;110;110;230;230;150;150;0" keyTimes="0.0000;0.0300;0.3000;0.3200;0.3800;0.6000;0.6400;0.9600;1.0000" dur="10.0s" repeatCount="indefinite"/></rect><rect x="400" y="168" width="230" height="18" rx="9" fill="#f85149" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3800;0.4000;0.6000;0.6200;1.0000" dur="10.0s" repeatCount="indefinite"/></rect><text class="s" x="515" y="226" text-anchor="middle">reads out: around 2 MB/s</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3900;0.4050;0.6000;0.6150;1.0000" dur="10.0s" repeatCount="indefinite"/><text class="bad" x="515" y="262" text-anchor="middle">FULL: extra writes are rejected</text></g><path class="lane" stroke="#58a6ff" d="M180,160 H378" marker-end="url(#ab)"/><text class="put" x="280" y="146" text-anchor="middle">PUT</text><path d="M378,196 H182" fill="none" stroke="#f85149" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#ar)" opacity=".5"/><text class="bad" x="280" y="218" text-anchor="middle">rejected</text><g filter="url(#glow)"><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0300;0.0330;0.1000;0.1030;1.0000" dur="10.0s" repeatCount="indefinite"/><circle r="6" fill="#58a6ff"/><animateMotion dur="10.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0300;0.1000;1" path="M180,160 H378"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1200;0.1230;0.1900;0.1930;1.0000" dur="10.0s" repeatCount="indefinite"/><circle r="6" fill="#58a6ff"/><animateMotion dur="10.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1200;0.1900;1" path="M180,160 H378"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2100;0.2130;0.2800;0.2830;1.0000" dur="10.0s" repeatCount="indefinite"/><circle r="6" fill="#58a6ff"/><animateMotion dur="10.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.2100;0.2800;1" path="M180,160 H378"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3300;0.3330;0.3900;0.3930;1.0000" dur="10.0s" repeatCount="indefinite"/><circle r="6" fill="#58a6ff"/><animateMotion dur="10.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.3300;0.3900;1" path="M180,160 H378"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3500;0.3530;0.4100;0.4130;1.0000" dur="10.0s" repeatCount="indefinite"/><circle r="6" fill="#58a6ff"/><animateMotion dur="10.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.3500;0.4100;1" path="M180,160 H378"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3700;0.3730;0.4300;0.4330;1.0000" dur="10.0s" repeatCount="indefinite"/><circle r="6" fill="#58a6ff"/><animateMotion dur="10.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.3700;0.4300;1" path="M180,160 H378"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3900;0.3930;0.4500;0.4530;1.0000" dur="10.0s" repeatCount="indefinite"/><circle r="6" fill="#58a6ff"/><animateMotion dur="10.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.3900;0.4500;1" path="M180,160 H378"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4100;0.4130;0.4700;0.4730;1.0000" dur="10.0s" repeatCount="indefinite"/><circle r="6" fill="#58a6ff"/><animateMotion dur="10.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.4100;0.4700;1" path="M180,160 H378"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4300;0.4330;0.4900;0.4930;1.0000" dur="10.0s" repeatCount="indefinite"/><circle r="6" fill="#58a6ff"/><animateMotion dur="10.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.4300;0.4900;1" path="M180,160 H378"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4600;0.4630;0.5400;0.5430;1.0000" dur="10.0s" repeatCount="indefinite"/><circle r="6" fill="#f85149"/><text y="-12" text-anchor="middle" class="pk" style="fill:#f85149">rejected</text><animateMotion dur="10.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.4600;0.5400;1" path="M378,196 H182"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4900;0.4930;0.5700;0.5730;1.0000" dur="10.0s" repeatCount="indefinite"/><circle r="6" fill="#f85149"/><animateMotion dur="10.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.4900;0.5700;1" path="M378,196 H182"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5200;0.5230;0.6000;0.6030;1.0000" dur="10.0s" repeatCount="indefinite"/><circle r="6" fill="#f85149"/><animateMotion dur="10.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.5200;0.6000;1" path="M378,196 H182"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6600;0.6630;0.7200;0.7230;1.0000" dur="10.0s" repeatCount="indefinite"/><circle r="6" fill="#e3b341"/><text y="-12" text-anchor="middle" class="pk" style="fill:#e3b341">retry</text><animateMotion dur="10.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.6600;0.7200;1" path="M180,160 H378"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7300;0.7330;0.7900;0.7930;1.0000" dur="10.0s" repeatCount="indefinite"/><circle r="6" fill="#e3b341"/><animateMotion dur="10.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.7300;0.7900;1" path="M180,160 H378"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.8000;0.8030;0.8600;0.8630;1.0000" dur="10.0s" repeatCount="indefinite"/><circle r="6" fill="#e3b341"/><animateMotion dur="10.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.8000;0.8600;1" path="M180,160 H378"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6300;0.6450;0.9000;0.9150;1.0000" dur="10.0s" repeatCount="indefinite"/><text class="amb" x="280" y="258" text-anchor="middle">the producer retries</text></g><text class="cap" x="30" y="346" opacity=".35"><animate attributeName="opacity" values="0.35;0.35;1;1;0.35;0.35" keyTimes="0.0000;0.0200;0.0450;0.3100;0.3350;1.0000" dur="10.0s" repeatCount="indefinite"/>1  Normal traffic: the shard has room, so every write is accepted</text><text class="cap" x="30" y="370" opacity=".35"><animate attributeName="opacity" values="0.35;0.35;1;1;0.35;0.35" keyTimes="0.0000;0.3200;0.3450;0.6200;0.6450;1.0000" dur="10.0s" repeatCount="indefinite"/>2  Too much at once: the shard is full, so the extra writes are rejected (throttled)</text><text class="cap" x="30" y="394" opacity=".35"><animate attributeName="opacity" values="0.35;0.35;1;1;0.35;0.35" keyTimes="0.0000;0.6300;0.6550;0.9400;0.9650;1.0000" dur="10.0s" repeatCount="indefinite"/>3  The producer retries the rejected records, and they are accepted</text></svg>
