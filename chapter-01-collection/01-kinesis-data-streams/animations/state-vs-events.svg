<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d"><title id="t">Current state versus event flow</title><desc id="d">A video player sends every event to Kinesis, while MongoDB keeps only the latest playback position.</desc><defs><style>
 .bg{fill:#0d1117} .node{fill:#161b22;stroke:#30363d;stroke-width:1.5} .big{fill:#161b22;stroke:#e9a23b;stroke-width:2} .panel{fill:#11161d;stroke:#30363d;stroke-width:1.5}
 .t{font:700 18px "Segoe UI",Helvetica,Arial,sans-serif;fill:#e6edf3} .s{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#8b949e} .h{font:700 15px "Segoe UI",Helvetica,Arial,sans-serif;fill:#e6edf3}
 .put{font:700 15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#58a6ff} .get{font:700 15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#e3b341} .ok{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#3fb950} .bad{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#f85149} .amb{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#e3b341}
 .pk{font:700 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace} .cap{font:13px "Segoe UI",Helvetica,Arial,sans-serif;fill:#e6edf3} .tiny{font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#7d8590} .mid{font:12px "Segoe UI",Helvetica,Arial,sans-serif;fill:#aab4c0}
 .slot{fill:#0d1117;stroke:#30363d;stroke-width:1.5;stroke-dasharray:3 3} .lane{fill:none;stroke-width:2.5}
 .gone{fill:#0d1117;stroke:#4b4f55;stroke-width:1.5;stroke-dasharray:4 4}
</style><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#58a6ff"/></marker><marker id="ay" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e3b341"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3fb950"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f85149"/></marker><marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b949e"/></marker><filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect class="bg" width="960" height="420" rx="16"/><rect class="node" x="390" y="20" width="180" height="66" rx="14"/><text class="t" x="480.0" y="51.0" text-anchor="middle">Video player</text><text class="s" x="480.0" y="73.0" text-anchor="middle">the application</text><rect class="panel" x="40" y="140" width="520" height="170" rx="14" style="stroke:#e3b341"/><text class="h" x="62" y="170">Kinesis: the event stream</text><text class="s" x="62" y="190">keeps every event, in order</text><rect class="panel" x="600" y="140" width="320" height="170" rx="14" style="stroke:#3fb950"/><text class="h" x="622" y="170">MongoDB: the current state</text><text class="s" x="622" y="190">keeps the latest value only</text><text class="s" x="622" y="222">current playback position</text><rect class="slot" x="62" y="228" width="92" height="36" rx="6"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1500;0.1650;0.9400;0.9550;1.0000" dur="10.0s" repeatCount="indefinite"/><rect x="62" y="228" width="92" height="36" rx="6" fill="#e3b341"/><text x="108.0" y="250.0" text-anchor="middle" style="font:700 10px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#0d1117">PLAY</text></g><rect class="slot" x="162" y="228" width="92" height="36" rx="6"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3000;0.3150;0.9400;0.9550;1.0000" dur="10.0s" repeatCount="indefinite"/><rect x="162" y="228" width="92" height="36" rx="6" fill="#e3b341"/><text x="208.0" y="250.0" text-anchor="middle" style="font:700 10px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#0d1117">PAUSE</text></g><rect class="slot" x="262" y="228" width="92" height="36" rx="6"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4500;0.4650;0.9400;0.9550;1.0000" dur="10.0s" repeatCount="indefinite"/><rect x="262" y="228" width="92" height="36" rx="6" fill="#e3b341"/><text x="308.0" y="250.0" text-anchor="middle" style="font:700 10px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#0d1117">SEEK</text></g><rect class="slot" x="362" y="228" width="92" height="36" rx="6"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6000;0.6150;0.9400;0.9550;1.0000" dur="10.0s" repeatCount="indefinite"/><rect x="362" y="228" width="92" height="36" rx="6" fill="#e3b341"/><text x="408.0" y="250.0" text-anchor="middle" style="font:700 10px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#0d1117">BUFFER_START</text></g><rect class="slot" x="462" y="228" width="92" height="36" rx="6"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7500;0.7650;0.9400;0.9550;1.0000" dur="10.0s" repeatCount="indefinite"/><rect x="462" y="228" width="92" height="36" rx="6" fill="#e3b341"/><text x="508.0" y="250.0" text-anchor="middle" style="font:700 10px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#0d1117">BUFFER_END</text></g><text x="622" y="285" style="font:700 40px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#3fb950" opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.3000;0.3200;1.0000" dur="10.0s" repeatCount="indefinite"/>00:00</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3000;0.3200;0.4500;0.4700;1.0000" dur="10.0s" repeatCount="indefinite"/><text x="622" y="285" style="font:700 40px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#3fb950">12:40</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4500;0.4700;0.7500;0.7700;1.0000" dur="10.0s" repeatCount="indefinite"/><text x="622" y="285" style="font:700 40px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#3fb950">32:00</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7500;0.7700;0.9900;1.0000;1.0000" dur="10.0s" repeatCount="indefinite"/><text x="622" y="285" style="font:700 40px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#3fb950">32:15</text></g><path class="lane" stroke="#e3b341" d="M430,86 L300,140" marker-end="url(#ay)"/><text class="amb" x="330" y="108" text-anchor="end">every event</text><path class="lane" stroke="#3fb950" d="M530,86 L760,140" marker-end="url(#ag)"/><text class="ok" x="660" y="108">update the position</text><g filter="url(#glow)"><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0600;0.0630;0.1500;0.1530;1.0000" dur="10.0s" repeatCount="indefinite"/><circle r="5" fill="#e3b341"/><animateMotion dur="10.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0600;0.1500;1" path="M430,88 L300,138"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0600;0.0630;0.1500;0.1530;1.0000" dur="10.0s" repeatCount="indefinite"/><circle r="5" fill="#3fb950"/><animateMotion dur="10.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0600;0.1500;1" path="M530,88 L760,138"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2100;0.2130;0.3000;0.3030;1.0000" dur="10.0s" repeatCount="indefinite"/><circle r="5" fill="#e3b341"/><animateMotion dur="10.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.2100;0.3000;1" path="M430,88 L300,138"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2100;0.2130;0.3000;0.3030;1.0000" dur="10.0s" repeatCount="indefinite"/><circle r="5" fill="#3fb950"/><animateMotion dur="10.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.2100;0.3000;1" path="M530,88 L760,138"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3600;0.3630;0.4500;0.4530;1.0000" dur="10.0s" repeatCount="indefinite"/><circle r="5" fill="#e3b341"/><animateMotion dur="10.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.3600;0.4500;1" path="M430,88 L300,138"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3600;0.3630;0.4500;0.4530;1.0000" dur="10.0s" repeatCount="indefinite"/><circle r="5" fill="#3fb950"/><animateMotion dur="10.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.3600;0.4500;1" path="M530,88 L760,138"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5100;0.5130;0.6000;0.6030;1.0000" dur="10.0s" repeatCount="indefinite"/><circle r="5" fill="#e3b341"/><animateMotion dur="10.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.5100;0.6000;1" path="M430,88 L300,138"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5100;0.5130;0.6000;0.6030;1.0000" dur="10.0s" repeatCount="indefinite"/><circle r="5" fill="#3fb950"/><animateMotion dur="10.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.5100;0.6000;1" path="M530,88 L760,138"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6600;0.6630;0.7500;0.7530;1.0000" dur="10.0s" repeatCount="indefinite"/><circle r="5" fill="#e3b341"/><animateMotion dur="10.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.6600;0.7500;1" path="M430,88 L300,138"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6600;0.6630;0.7500;0.7530;1.0000" dur="10.0s" repeatCount="indefinite"/><circle r="5" fill="#3fb950"/><animateMotion dur="10.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.6600;0.7500;1" path="M530,88 L760,138"/></g></g><text class="cap" x="40" y="350" opacity=".35"><animate attributeName="opacity" values="0.35;0.35;1;1;0.35;0.35" keyTimes="0.0000;0.1200;0.1450;0.9000;0.9250;1.0000" dur="10.0s" repeatCount="indefinite"/>1  Kinesis keeps each event: PLAY, PAUSE, SEEK, BUFFER_START, BUFFER_END</text><text class="cap" x="40" y="374" opacity=".35"><animate attributeName="opacity" values="0.35;0.35;1;1;0.35;0.35" keyTimes="0.0000;0.1200;0.1450;0.9000;0.9250;1.0000" dur="10.0s" repeatCount="indefinite"/>2  MongoDB overwrites one value: the current playback position</text><text class="cap" x="40" y="398" opacity=".35"><animate attributeName="opacity" values="0.35;0.35;1;1;0.35;0.35" keyTimes="0.0000;0.6500;0.6750;0.9900;1.0000;1.0000" dur="10.0s" repeatCount="indefinite"/>3  Events tell the whole story. State tells you where things stand right now.</text></svg>
