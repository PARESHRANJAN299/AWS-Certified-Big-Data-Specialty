 .gone{fill:#0d1117;stroke:#4b4f55;stroke-width:1.5;stroke-dasharray:4 4}
</style><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#58a6ff"/></marker><marker id="ay" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e3b341"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3fb950"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f85149"/></marker><marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b949e"/></marker><filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect class="bg" width="960" height="416" rx="16"/><rect class="panel" x="20" y="20" width="450" height="290" rx="14"/><rect class="panel" x="490" y="20" width="450" height="290" rx="14"/><text class="t" x="40" y="52">Kinesis Data Streams</text><text class="s" x="40" y="72">you process the stream</text><text class="t" x="510" y="52">Amazon Data Firehose</text><text class="s" x="510" y="72">it delivers the stream</text><rect class="node" x="36" y="150" width="100" height="64" rx="12"/><text class="h" x="48" y="187.0">Producer</text><rect class="big" x="186" y="110" width="116" height="144" rx="12"/><text class="h" x="200" y="136">Stream</text><text class="tiny" x="200" y="154">keeps the events</text><rect class="slot" x="200" y="170" width="88" height="20" rx="6"/><rect class="slot" x="200" y="196" width="88" height="20" rx="6"/><rect class="slot" x="200" y="222" width="88" height="20" rx="6"/><path d="M136,182 H184" stroke="#3d444d" stroke-width="2" fill="none" marker-end="url(#aw)"/><path d="M302,182 C330,182 332,116