values="0;0;1;1;0;0" keyTimes="0.0000;0.7042;0.7067;0.7875;0.7900;1.0000" dur="12.0s" repeatCount="indefinite"/><circle r="5" fill="#3fb950"/><animateMotion dur="12.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.7042;0.7875;1" path="M790,182 C810,182 812,164 832,164"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7167;0.7192;0.8000;0.8025;1.0000" dur="12.0s" repeatCount="indefinite"/><circle r="5" fill="#3fb950"/><animateMotion dur="12.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.7167;0.8000;1" path="M790,182 C810,182 812,214 832,214"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7292;0.7317;0.8125;0.8150;1.0000" dur="12.0s" repeatCount="indefinite"/><circle r="5" fill="#3fb950"/><animateMotion dur="12.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.7292;0.8125;1" path="M790,182 C810,182 812,264 832,264"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7750;0.7875;0.9583;0.9708;1.0000" dur="12.0s" repeatCount="indefinite"/><text class="ok" x="814" y="292" text-anchor="middle">delivered</text></g><text class="cap" x="30" y="346" opacity=".35"><animate attributeName="opacity" values="0.35;0.35;1;1;0.35;0.35" keyTimes="0.0000;0.0167;0.0375;0.6250;0.6458;1.0000" dur="12.0s" repeatCount="indefinite"/>1  Streams: you build the consumers. Many consumers read the same events, each at its own pace, and you can replay</text><text class="cap" x="30" y="370" opacity=".35"><animate attributeName="opacity" values="0.35;0.35;1;1;0.35;0.35" keyTimes="0.0000;0.3333;0.3542;0.9583;0.9792;1.0000" dur="12.0s" repeatCount="indefinite"/>2  Firehose: it buffers, transforms and delivers for you, with no shards or consumers to manage</text><text class="cap" x="30" y="394" opacity=".35"><animate attributeName="opacity" values="0.35;0.35;1;1;0.35;0.35" keyTimes="0.0000;0.6667;0.6875;0.9833;1.0000;1.0000" dur="12.0s" repeatCount="indefinite"/>3  Memory trick: Streams = process the stream.  Firehose = deliver the stream.</text></svg>
