<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 416" width="960" height="416" role="img" aria-labelledby="t d"><title id="t">Kinesis Data Streams versus Amazon Data Firehose</title><desc id="d">Data Streams keeps events so several consumers can read and replay them. Firehose buffers the data and delivers it to S3, Redshift, OpenSearch and Splunk.</desc><defs><style>
 .bg{fill:#0d1117} .node{fill:#161b22;stroke:#30363d;stroke-width:1.5} .big{fill:#161b22;stroke:#e9a23b;stroke-width:2} .panel{fill:#11161d;stroke:#30363d;stroke-width:1.5}
