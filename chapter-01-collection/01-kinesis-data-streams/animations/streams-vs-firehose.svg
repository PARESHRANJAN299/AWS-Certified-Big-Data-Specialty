ompress</text><rect x="664" y="184" width="112" height="12" rx="6" fill="#1c2128"/><rect x="664" y="184" width="0" height="12" rx="6" fill="#58a6ff"><animate attributeName="width" values="0;112;112;0;0" keyTimes="0.0000;0.6333;0.6667;0.6833;1.0000" dur="12.0s" repeatCount="indefinite"/></rect><text class="tiny" x="664" y="216">buffer fills, then delivers</text><path d="M606,182 H648" stroke="#3d444d" stroke-width="2" fill="none" marker-end="url(#aw)"/><path d="M790,182 C810,182 812,114 830,114" stroke="#58a6ff" stroke-width="2" fill="none" opacity=".7" marker-end="url(#aw)"/><rect class="node" x="832" y="96" width="94" height="36" rx="12"/><text class="h" x="844" y="119.0">Amazon S3</text><path d="M790,182 C810,182 812,164 830,164" stroke="#58a6ff" stroke-width="2" fill="none" opacity=".7" marker-end="url(#aw)"/><rect class="node" x="832" y="146" width="94" height="36" rx="12"/><text class="h" x="844" y="169.0">Redshift</text><path d="M790,182 C810,182 812,214 830,214" stroke="#58a6ff" stroke-width="2" fill="none" opacity=".7" marker-end="url(#aw)"/><rect class="node" x="832" y="196" width="94" height="36" rx="12"/><text class="h" x="844" y="219.0">OpenSearch</text><path d="M790,182 C810,182 812,264 830,264" stroke="#58a6ff" stroke-width="2" fill="none" opacity=".7" marker-end="url(#aw)"/><rect class="node" x="832" y="246" width="94" height="36" rx="12"/><text class="h" x="844" y="269.0">Splunk</text><g filter="url(#glow)"><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0167;0.0192;0.0667;0.0692;1.0000" dur="12.0s" repeatCount="indefinite"/><circle r="5" fill="#58a6ff"/><animateMotion dur="12.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0167;0.0667;1" path="M136,182 H186"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0917;0.0942;0.1417;0.1442;1.0000" dur="12.0s" repeatCount="indefinite"/><circle r="5" fill="#58a6ff"/><animateMotion dur="12.0s" r